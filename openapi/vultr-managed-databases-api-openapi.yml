openapi: 3.2.0
info:
  title: Vultr Managed Databases API
  version: '2.0'
  contact:
    email: support@vultr.com
    name: ''
    url: https://www.vultr.com
  description: 'Operations tagged managed-databases across 2 of this provider''s published API definitions: vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- description: Vultr Managed Databases is a managed database offering supporting MySQL, PostgreSQL, FerretDB + PostgreSQL, and Redis.
  name: managed-databases
  x-displayName: Managed Databases
paths:
  /databases/plans:
    get:
      description: List all Managed Databases plans.
      operationId: list-database-plans
      parameters:
      - description: 'Filter by engine type


          * `mysql`

          * `pg`

          * `redis`.'
        explode: true
        in: query
        name: engine
        required: false
        schema:
          type: string
        style: form
      - description: Filter by number of nodes.
        explode: true
        in: query
        name: nodes
        required: false
        schema:
          type: integer
        style: form
      - description: Filter by [Region id](#operation/list-regions).
        explode: true
        in: query
        name: region
        required: false
        schema:
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              examples:
                plans:
                  value:
                    plans:
                    - id: vultr-dbaas-hobbyist-cc-1-25-1
                      number_of_nodes: 1
                      type: vc2
                      vcpu_count: 1
                      ram: 1024
                      disk: 25
                      monthly_cost: 15
                      supported_engines:
                        mysql: true
                        pg: true
                        redis: false
                      max_connections:
                        mysql: 75
                        pg: 22
                      locations:
                      - DEV
                      - ICN
                      - SEA
              schema:
                $ref: '#/components/schemas/list_database_plans_200_response'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - API Key: []
      summary: List Managed Database Plans
      tags:
      - managed-databases
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/databases/plans\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      x-accepts: application/json
    servers:
    - url: https://api.vultr.com/v2
  /databases:
    get:
      description: List all Managed Databases in your account.
      operationId: list-databases
      parameters:
      - description: Filter by label.
        explode: true
        in: query
        name: label
        required: false
        schema:
          type: string
        style: form
      - description: Filter by specific tag.
        explode: true
        in: query
        name: tag
        required: false
        schema:
          type: string
        style: form
      - description: Filter by [Region id](#operation/list-regions).
        explode: true
        in: query
        name: region
        required: false
        schema:
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              examples:
                database:
                  value:
                    databases:
                    - id: 999c4ed0-f2e4-4f2a-a951-de358ceb9ab5
                      date_created: 2022-05-09 10:13:31
                      plan: vultr-dbaas-hobbyist-cc-1-25-1
                      plan_disk: 25
                      plan_ram: 1024
                      plan_vcpus: 1
                      plan_replicas: 0
                      region: EWR
                      database_engine: mysql
                      database_engine_version: 8
                      vpc_id: d39bf0bf-e050-47d4-a291-5d6fc736f250
                      status: Running
                      label: some label
                      tag: some tag
                      dbname: defaultdb
                      host: HOSTNAME_GOES_HERE
                      public_host: PUBLIC_HOSTNAME_GOES_HERE
                      user: vultradmin
                      password: PASSWORD_GOES_HERE
                      port: 16751
                      maintenance_dow: sunday
                      maintenance_time: 06:00:00
                      latest_backup: 2022-11-02 12:58:18"
                      trusted_ips:
                      - '...'
                      mysql_sql_modes:
                      - ANSI
                      - ERROR_FOR_DIVISION_BY_ZERO
                      - NO_ENGINE_SUBSTITUTION
                      - NO_ZERO_DATE
                      - NO_ZERO_IN_DATE
                      - STRICT_ALL_TABLES
                      mysql_require_primary_key: true
                      mysql_slow_query_log: false
                      cluster_time_zone: America/New_York
                      read_replicas:
                      - '...'
                    meta:
                      total: 1
              schema:
                $ref: '#/components/schemas/list_databases_200_response'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - API Key: []
      summary: List Managed Databases
      tags:
      - managed-databases
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/databases\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      x-accepts: application/json
    post:
      description: Create a new Managed Database in a `region` with the desired `plan`. Supply optional attributes as desired.
      operationId: create-database
      requestBody:
        content:
          application/json:
            examples:
              request:
                value:
                  database_engine: mysql
                  database_engine_version: '8'
                  region: ewr
                  plan: vultr-dbaas-hobbyist-cc-1-25-1
                  label: Example Managed Database
            schema:
              $ref: '#/components/schemas/create_database_request'
        description: Include a JSON object in the request body with a content type of **application/json**.
      responses:
        '202':
          content:
            application/json:
              examples:
                database:
                  value:
                    database:
                      id: 999c4ed0-f2e4-4f2a-a951-de358ceb9ab5
                      date_created: 2022-05-09 10:13:31
                      plan: vultr-dbaas-hobbyist-cc-1-25-1
                      plan_disk: 25
                      plan_ram: 1024
                      plan_vcpus: 1
                      plan_replicas: 0
                      region: EWR
                      database_engine: mysql
                      database_engine_version: 8
                      vpc_id: d39bf0bf-e050-47d4-a291-5d6fc736f250
                      status: Running
                      label: some label
                      tag: some tag
                      dbname: defaultdb
                      host: HOSTNAME_GOES_HERE
                      public_host: PUBLIC_HOSTNAME_GOES_HERE
                      user: vultradmin
                      password: PASSWORD_GOES_HERE
                      port: 16751
                      maintenance_dow: sunday
                      maintenance_time: 06:00:00
                      latest_backup: 2022-11-02 12:58:18"
                      trusted_ips:
                      - '...'
                      mysql_sql_modes:
                      - ANSI
                      - ERROR_FOR_DIVISION_BY_ZERO
                      - NO_ENGINE_SUBSTITUTION
                      - NO_ZERO_DATE
                      - NO_ZERO_IN_DATE
                      - STRICT_ALL_TABLES
                      mysql_require_primary_key: true
                      mysql_slow_query_log: false
                      cluster_time_zone: America/New_York
                      read_replicas:
                      - '...'
              schema:
                $ref: '#/components/schemas/create_database_202_response'
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Validation Error
      security:
      - API Key: []
      summary: Create Managed Database
      tags:
      - managed-databases
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/databases\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"database_engine\" : \"mysql\",\n    \"database_engine_version\" : \"8\"\n    \"region\" : \"ewr\",\n    \"plan\" : \"vultr-dbaas-hobbyist-cc-1-25-1\",\n    \"label\" : \"Example Managed Database\"\n  }'"
      x-content-type: application/json
      x-accepts: application/json
    servers:
    - url: https://api.vultr.com/v2
  /databases/{database-id}:
    delete:
      description: Delete a Managed Database.
      operationId: delete-database
      parameters:
      - description: The [Managed Database ID](#operation/list-databases).
        explode: false
        in: path
        name: database-id
        required: true
        schema:
          type: string
        style: simple
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      security:
      - API Key: []
      summary: Delete Managed Database
      tags:
