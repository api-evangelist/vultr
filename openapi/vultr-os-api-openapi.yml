openapi: 3.2.0
info:
  title: Vultr Os API
  version: '2.0'
  description: 'Operations tagged os across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: Os
  x-displayName: Operating Systems
  description: We have a wide range of operating systems available to deploy server instances. You can also upload an ISO or choose from our public ISO library.
paths:
  /os:
    get:
      summary: List OS
      tags:
      - Os
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/os\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  os:
                    type: array
                    items:
                      $ref: '#/components/schemas/os'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                response:
                  value:
                    os:
                    - id: 127
                      name: CentOS 6 x64
                      arch: x64
                      family: centos
                    meta:
                      total: 1
                      links:
                        next: ''
                        prev: ''
      operationId: list-os
      description: List the OS images available for installation at Vultr.
      parameters:
      - schema:
          type: integer
        in: query
        name: per_page
        description: 'Number of items requested per page. Default is 100 and Max is 500.

          '
      - schema:
          type: string
        in: query
        name: cursor
        description: Cursor for paging. See [Meta and Pagination](#section/Introduction/Meta-and-Pagination).
      security: []
    servers:
    - url: https://api.vultr.com/v2
