openapi: 3.2.0
info:
  title: Vultr Snapshot API
  version: '2.0'
  description: 'Operations tagged snapshot across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: Snapshot
  x-displayName: Snapshots
  description: A snapshot is a point-in-time image of an instance. We do not stop the instance when taking a snapshot. Booting from a snapshot is similar to rebooting after a non-graceful restart. Snapshots are physically the same as backups, but snapshots are manual while backups run automatically on a schedule. See our Snapshot Quickstart Guide for more information.
paths:
  /snapshots/{snapshot-id}:
    parameters:
    - schema:
        type: string
      name: snapshot-id
      in: path
      required: true
      description: The [Snapshot id](#operation/list-snapshots).
    delete:
      summary: Delete Snapshot
      tags:
      - Snapshot
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/snapshots/{snapshot-id}\" \\\n  -X DELETE \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: delete-snapshot
      description: Delete a Snapshot.
      security:
      - API Key: []
    get:
      summary: Get Snapshot
      tags:
      - Snapshot
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/snapshots/{snapshot-id}\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot:
                    $ref: '#/components/schemas/snapshot'
              examples:
                response:
                  value:
                    snapshot:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      description: Example Snapshot
                      size: 42949672960
                      compressed_size: 949678560
                      status: complete
                      os_id: 215
                      app_id: 0
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: get-snapshot
      description: Get information about a Snapshot.
      security:
      - API Key: []
    put:
      summary: Update Snapshot
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/snapshots/{snapshot-id}\" \\\n  -X PUT \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"description\": \"Example Snapshot\"\n  }'"
      operationId: put-snapshots-snapshot-id
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      description: Update the description for a Snapshot.
      tags:
      - Snapshot
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: The user-supplied description for the Snapshot.
              required:
              - description
            examples:
              request:
                value:
                  description: Example Snapshot
        description: Include a JSON object in the request body with a content type of **application/json**.
      security:
      - API Key: []
    servers:
    - url: https://api.vultr.com/v2
  /snapshots:
    get:
      summary: List Snapshots
      tags:
      - Snapshot
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/snapshots\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items:
                      $ref: '#/components/schemas/snapshot'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                response:
                  value:
                    snapshots:
                    - id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      description: Example Snapshot
                      size: 42949672960
                      compressed_size: 949678560
                      status: complete
                      os_id: 215
                      app_id: 0
                    meta:
                      total: 1
                      links:
                        next: ''
                        prev: ''
        '401':
          description: Unauthorized
      operationId: list-snapshots
      description: Get information about all Snapshots in your account.
      security:
      - API Key: []
      parameters:
      - schema:
          type: integer
        in: query
        name: per_page
        description: Number of items requested per page. Default is 100 and Max is 500.
      - schema:
          type: string
        in: query
        name: cursor
        description: Cursor for paging. See [Meta and Pagination](#section/Introduction/Meta-and-Pagination).
    post:
      summary: Create Snapshot
      tags:
      - Snapshot
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/snapshots\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"instance_id\" : \"cb676a46-66fd-4dfb-b839-443f2e6c0b60\",\n    \"description\" : \"Example Snapshot\"\n  }'"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot:
                    $ref: '#/components/schemas/snapshot'
              examples:
                response:
                  value:
                    snapshot:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      description: Example Snapshot
                      size: 0
                      compressed_size: 0
                      status: pending
                      os_id: 215
                      app_id: 0
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      operationId: create-snapshot
      description: Create a new Snapshot for `instance_id`.
      security:
      - API Key: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instance_id:
                  type: string
                  description: Create a Snapshot for this [Instance id](#operation/list-instances).
                description:
                  type: string
                  description: The user-supplied description of the Snapshot.
              required:
              - instance_id
            examples:
              request:
                value:
                  instance_id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                  description: Example Snapshot
        description: Include a JSON object in the request body with a content type of **application/json**.
    servers:
    - url: https://api.vultr.com/v2
  /snapshot/create-from-url:
    post:
      summary: Create Snapshot from URL
      tags:
      - Snapshot
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/snapshots/create-from-url\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"url\" : \"https://example.com/disk_image.raw\"\n  }'"
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot:
                    $ref: '#/components/schemas/snapshot'
              examples:
                snapshot:
                  value:
                    snapshot:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      description: Example Snapshot
                      size: 0
                      compressed_size: 0
                      status: pending
                      os_id: 215
                      app_id: 0
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: create-snapshot-create-from-url
      description: Create a new Snapshot from a RAW image located at `url`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: The public URL containing a RAW image.
              required:
              - url
            examples:
              example:
                value:
                  url: http://example.com/disk_image.raw
        description: Include a JSON object in the request body with a content type of **application/json**.
      security:
      - API Key: []
    servers:
    - url: https://api.vultr.com/v2
  /snapshots/create-from-url:
    post:
      description: Create a new Snapshot from a RAW image located at `url`.
      operationId: postSnapshotsCreateFromUrl
      requestBody:
