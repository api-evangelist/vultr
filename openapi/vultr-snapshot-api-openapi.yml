          description: Accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      security:
      - API Key: []
      summary: Create Snapshot from URL
      tags:
      - Snapshot
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/snapshots/create-from-url\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"url\" : \"https://example.com/disk_image.raw\",\n    \"description\" : \"Example Snapshot\",\n    \"uefi\": \"no\"\n  }'"
      x-content-type: application/json
      x-accepts: application/json
      x-operation-id-source: normalized
      x-operation-id-original: create-snapshot-create-from-url
    servers:
    - url: https://api.vultr.com/v2
