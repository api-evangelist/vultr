openapi: 3.2.0
info:
  title: Vultr Region API
  version: '2.0'
  description: 'Operations tagged region across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: Region
  x-displayName: Regions
  description: Instances can be deployed in many Regions on multiple continents. Choose any of our worldwide locations to deploy servers near your office or customers for low-latency.
paths:
  /regions:
    get:
      summary: List Regions
      tags:
      - Region
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/regions\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  regions:
                    type: array
                    items:
                      $ref: '#/components/schemas/region'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                region:
                  value:
                    regions:
                    - id: ams
                      city: Amsterdam
                      country: NL
                      continent: Europe
                      options:
                      - ddos_protection
                    meta:
                      total: 1
                      links:
                        next: ''
                        prev: ''
      operationId: list-regions
      description: List all Regions at Vultr.
      parameters:
      - schema:
          type: integer
        in: query
        name: per_page
        description: Number of items requested per page. Default is 100 and Max is 500.
      - schema:
          type: string
        in: query
        name: cursor
        description: Cursor for paging. See [Meta and Pagination](#section/Introduction/Meta-and-Pagination).
      security: []
    servers:
    - url: https://api.vultr.com/v2
  /regions/{region-id}/availability:
    parameters:
    - schema:
        type: string
      name: region-id
      in: path
      required: true
      description: The [Region id](#operation/list-regions).
    get:
      summary: List available compute in region
      tags:
      - Region
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/regions/{region-id}/availability\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available_plans:
                    type: array
                    description: An array of Plans available in this Region.
                    items:
                      type: string
              examples:
                plans:
                  value:
                    available_plans:
                    - vc2-1c-1gb
                    - vc2-1c-2gb
                    - vc2-2c-4gb
                    - vc2-4c-8gb
                    - vc2-6c-16gb
                    - vc2-8c-32gb
                    - vc2-16c-64gb
                    - vc2-24c-96gb
                    - vdc-4vcpu-8gb
                    - vdc-4vcpu-16gb
                    - vdc-6vcpu-24gb
                    - vdc-8vcpu-32gb
                    - vhf-1c-1gb
                    - vhf-1c-2gb
                    - vhf-2c-4gb
                    - vhf-3c-8gb
                    - vhf-4c-16gb
                    - vhf-6c-24gb
                    - vhf-8c-32gb
                    - vhf-12c-48gb
      operationId: list-available-compute-region
      description: Get a list of the available plans in Region `region-id`. Not all plans are available in all regions. The list can be filtered by `type`.
      parameters:
      - schema:
          type: string
        in: query
        name: type
        description: 'Filter the results by type.


          |   | Type | Description |

          | - | ------ | ------------- |

          |   | all | All available types |

          |   | vc2 | Cloud Compute |

          |   | vdc | Dedicated Cloud |

          |   | vhf | High Frequency Compute |

          |   | vbm | Bare Metal |

          '
      security: []
    servers:
    - url: https://api.vultr.com/v2
