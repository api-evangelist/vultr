openapi: 3.2.0
info:
  title: Vultr Reserved Ip API
  version: '2.0'
  description: 'Operations tagged reserved-ip across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: reserved-ip
  x-displayName: Reserved IPs
  description: IP addresses can be reserved and moved between instances. Reserved IPs can also be used as floating addresses for high-availability.
paths:
  /reserved-ips/{reserved-ip}:
    parameters:
    - schema:
        type: string
      name: reserved-ip
      in: path
      required: true
      description: The [Reserved IP id](#operation/list-reserved-ips).
    get:
      summary: Get Reserved IP
      tags:
      - reserved-ip
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/reserved-ips/{reserved-ip}\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reserved_ip:
                    $ref: '#/components/schemas/reserved-ip'
              examples:
                example-1:
                  value:
                    reserved_ip:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      region: ewr
                      ip_type: v4
                      subnet: 192.0.2.123
                      subnet_size: 32
                      label: Example Reserved IPv4
                      instance_id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: get-reserved-ip
      description: Get information about a Reserved IP.
      security:
      - API Key: []
    delete:
      summary: Delete Reserved IP
      operationId: delete-reserved-ip
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      description: Delete a Reserved IP.
      tags:
      - reserved-ip
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/reserved-ips/{reserved-ip}\" \\\n  -X DELETE \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      security:
      - API Key: []
    patch:
      description: Update information on a Reserved IP.
      operationId: patch-reserved-ips-reserved-ip
      parameters:
      - description: The [Reserved IP id](#operation/list-reserved-ips).
        explode: false
        in: path
        name: reserved-ip
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              request:
                value:
                  label: Example Label
            schema:
              $ref: '#/components/schemas/patch_reserved_ips_reserved_ip_request'
        description: Include a JSON object in the request body with a content type of **application/json**.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_reserved_ip_200_response'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      security:
      - API Key: []
      summary: Update Reserved IP
      tags:
      - reserved-ip
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/reserved-ips/{reserved-ip}\" \\\n  -X PATCH \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"label\" : \"Example Label\"\n  }'"
      x-content-type: application/json
      x-accepts: application/json
    servers:
    - url: https://api.vultr.com/v2
  /reserved-ips:
    parameters: []
    get:
