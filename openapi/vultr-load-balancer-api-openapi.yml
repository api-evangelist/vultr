        source: "curl \"https://api.vultr.com/v2/load-balancers/{load-balancer-id}\" \\\n  -X DELETE \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '204':
          description: No Content
        '400':
