openapi: 3.2.0
info:
  title: Vultr Load Balancer API
  version: '2.0'
  description: 'Operations tagged load-balancer across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: load-balancer
  x-displayName: Load Balancers
  description: Load Balancers sit in front of your application and distribute incoming traffic across multiple Instances. When you control the load balancer via the API, you can inspect the results in the customer portal.
paths:
  /load-balancers:
    parameters: []
    get:
      summary: List Load Balancers
      tags:
      - load-balancer
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/load-balancers\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      operationId: list-load-balancers
      description: List the Load Balancers in your account.
      security:
      - API Key: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  load_balancers:
                    type: array
                    items:
                      $ref: '#/components/schemas/loadbalancer'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                response:
                  value:
                    load_balancers:
                    - id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      region: ewr
                      label: Example Load Balancer
                      status: active
                      ipv4: 192.0.2.123
                      ipv6: 2001:0db8:5:4973:ffff:ffff:ffff:ffff
                      generic_info:
                        balancing_algorithm: roundrobin
                        ssl_redirect: false
                        sticky_sessions:
                          cookie_name: example-cookie
                        proxy_protocol: false
                        private_network: 9fed374c-0afc-42bf-926c-abcf840b5406
                      health_check:
                        protocol: http
                        port: 80
                        path: /health
                        check_interval: 10
                        response_timeout: 5
                        unhealthy_threshold: 3
                        healthy_threshold: 3
                      has_ssl: false
                      forwarding_rules:
                      - id: 73d85156c2c3129d
                        frontend_protocol: http
                        frontend_port: 80
                        backend_protocol: http
                        backend_port: 80
                      firewall_rules:
                      - id: abcd123b93016eafb
                        port: 80
                        source: 198.51.100.0/24
                        ip_type: v4
                      instances: []
                    meta:
                      total: 1
                      links:
                        next: ''
                        prev: ''
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      parameters:
      - schema:
          type: integer
        in: query
        name: per_page
        description: 'Number of items requested per page. Default is 100 and Max is 500.

          '
      - schema:
          type: string
        in: query
        name: cursor
        description: Cursor for paging. See [Meta and Pagination](#section/Introduction/Meta-and-Pagination).
    post:
      summary: Create Load Balancer
      tags:
      - load-balancer
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/load-balancers\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"region\" : \"ewr\",\n    \"balancing_algorithm\" : \"roundrobin\",\n    \"ssl_redirect\" : false,\n    \"proxy_protocol\" : false,\n    \"label\" : \"Example Load Balancer\",\n    \"health_check\" : {\n      \"protocol\" : \"http\",\n      \"port\" : 80,\n      \"path\" : \"/health\",\n      \"check_interval\" : 10,\n      \"response_timeout\" : 5,\n      \"unhealthy_threshold\" : 3,\n      \"healthy_threshold\" : 3\n    },\n    \"forwarding_rules\": [\n      {\n        \"frontend_protocol\" : \"http\",\n        \"frontend_port\" : 80,\n        \"backend_protocol\" : \"http\",\n        \"backend_port\" : 80\n      }\n    ],\n    \"firewall_rules\": [\n      {\n        \"port\" : 80,\n        \"source\" : \"0.0.0.0/0\",\n        \"ip_type\" : \"v4\",\n      }\n    ]\n  }'"
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  load_balancer:
                    $ref: '#/components/schemas/loadbalancer'
              examples:
                response:
                  value:
                    load_balancer:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      region: ewr
                      label: Example Load Balancer
                      status: pending
                      ipv4: ''
                      ipv6: ''
                      generic_info:
                        balancing_algorithm: roundrobin
                        ssl_redirect: false
                        sticky_sessions:
                          cookie_name: example-cookie
                        proxy_protocol: false
                        private_network: 9fed374c-0afc-42bf-926c-abcf840b5406
                      health_check:
                        protocol: http
                        port: 80
                        path: /health
                        check_interval: 10
                        response_timeout: 5
                        unhealthy_threshold: 3
                        healthy_threshold: 3
                      has_ssl: false
                      forwarding_rules:
                      - id: 73d85156c2c3129d
                        frontend_protocol: http
                        frontend_port: 80
                        backend_protocol: http
                        backend_port: 80
                      firewall_rules:
                      - id: abcd123b93016eafb
                        port: 80
                        source: 24.187.16.196/16
                        ip_type: v4
                      instances: []
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: create-load-balancer
      description: Create a new Load Balancer in a particular `region`.
      security:
      - API Key: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                region:
                  type: string
                  description: The [Region id](#operation/list-regions) to create this Load Balancer.
                balancing_algorithm:
                  type: string
                  description: 'The balancing algorithm.


                    * roundrobin (default)

                    * leastconn'
                ssl_redirect:
                  type: boolean
                  description: 'If `true`, this will redirect all HTTP traffic to HTTPS. You must have an HTTPS rule and SSL certificate installed on the load balancer to enable this option.


                    * true

                    * false'
                proxy_protocol:
                  description: 'If `true`, you must configure backend nodes to accept Proxy protocol.


                    * true

                    * false (Default)'
                  type: boolean
                health_check:
                  type: object
                  description: The health check configuration. See [Load Balancer documentation](https://www.vultr.com/docs/vultr-load-balancers#Load_Balancer_Configuration).
                  properties:
                    protocol:
                      type: string
                      description: 'The protocol to use for health checks.


                        * HTTPS

                        * HTTP

                        * TCP'
                    port:
                      type: integer
                      description: The port to use for health checks.
                    path:
                      type: string
                      description: HTTP Path to check. Only applies if protocol is HTTP or HTTPS.
                    check_interval:
                      type: integer
                      description: Interval between health checks.
                    response_timeout:
                      type: integer
                      description: Timeout before health check fails.
                    unhealthy_threshold:
                      type: integer
                      description: Number times a check must fail before becoming unhealthy.
                    healthy_threshold:
                      type: integer
                      description: Number of times a check must succeed before returning to healthy status.
                forwarding_rules:
                  type: array
                  description: An array of forwarding rule objects.
                  items:
                    type: object
                    properties:
                      frontend_protocol:
                        type: string
                        description: 'The protocol on the Load Balancer to forward to the backend.


                          * HTTP

                          * HTTPS

                          * TCP'
                      frontend_port:
                        type: integer
                        description: The port number on the Load Balancer to forward to the backend.
                      backend_protocol:
                        type: string
                        description: 'The protocol destination on the backend server.


                          * HTTP

                          * HTTPS

                          * TCP'
                      backend_port:
                        type: integer
                        description: The port number destination on the backend server.
                sticky_session:
                  type: object
                  description: Enables sticky sessions for your load balancer when a cookie_name is provided.
                  properties:
                    cookie_name:
                      type: string
                      description: The cookie name to make sticky. See [Load Balancer documentation](https://www.vultr.com/docs/vultr-load-balancers#Load_Balancer_Configuration).
                ssl:
                  type: object
                  description: An SSL certificate to install on the Load Balancer.
                  properties:
                    private_key:
                      type: string
                      description: The private key.
                    certificate:
                      type: string
                      description: The SSL certificate.
                    chain:
                      type: string
                      description: The certificate chain.
                label:
                  type: string
                  description: Label for your Load Balancer.
                instances:
                  type: array
                  description: An array of instances IDs that you want attached to the load balancer.
                  items:
                    type: string
                firewall_rules:
                  type: array
                  description: An array of firewall rule objects.
                  items:
                    type: object
                    properties:
                      port:
                        type: integer
                        description: Port for this rule.
                      source:
                        type: string
                        description: 'If the source string is given a value of "cloudflare" then cloudflare IPs will be supplied. Otherwise enter a IP address with subnet size that you wish to permit through the firewall.


                          Possible values:


                          |   | Value | Description |

                          | - | ------ | ------------- |

                          |   | "192.168.1.1/16" | Ip address with a subnet size. |

                          |   | cloudflare | Allow all of Cloudflare''s IP space through the firewall |'
                      ip_type:
                        type: string
                        description: 'The type of IP rule.


                          * v4

                          * v6'
                private_network:
                  type: string
                  description: ID of the private network you wish to use. If private_network is omitted it will default to the public network.
              required:
              - region
            examples:
              request:
                value:
                  region: ewr
                  balancing_algorithm: roundrobin
                  ssl_redirect: false
                  proxy_protocol: false
                  label: Example Load Balancer
                  health_check:
                    protocol: http
                    port: 80
                    path: /health
                    check_interval: 10
                    response_timeout: 5
                    unhealthy_threshold: 3
                    healthy_threshold: 3
                  forwarding_rules:
                  - frontend_protocol: http
                    frontend_port: 80
                    backend_protocol: http
                    backend_port: 80
                  firewall_rules:
                  - port: 80
                    source: 24.187.16.196/16
                    ip_type: v4
                  private_network: 9fed374c-0afc-42bf-926c-abcf840b5406
        description: Include a JSON object in the request body with a content type of **application/json**.
    servers:
    - url: https://api.vultr.com/v2
  /load-balancers/{load-balancer-id}:
    parameters:
    - schema:
        type: string
      name: load-balancer-id
      in: path
      required: true
      description: The [Load Balancer id](#operation/list-load-balancers).
    get:
      summary: Get Load Balancer
      tags:
      - load-balancer
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/load-balancers/{load-balancer-id}\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  load_balancer:
                    $ref: '#/components/schemas/loadbalancer'
              examples:
                response:
                  value:
                    load_balancer:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      region: ewr
                      label: Example Load Balancer
                      status: active
                      ipv4: 192.0.2.123
                      ipv6: 2001:0db8:5:4973:ffff:ffff:ffff:ffff
                      generic_info:
                        balancing_algorithm: roundrobin
                        ssl_redirect: false
                        sticky_sessions:
                          cookie_name: example-cookie
                        proxy_protocol: false
                        private_network: 9fed374c-0afc-42bf-926c-abcf840b5406
                      health_check:
                        protocol: http
                        port: 80
                        path: /health
                        check_interval: 10
                        response_timeout: 5
                        unhealthy_threshold: 3
                        healthy_threshold: 3
                      has_ssl: false
                      forwarding_rules:
                      - id: 73d85156c2c3129d
                        frontend_protocol: http
                        frontend_port: 80
                        backend_protocol: http
                        backend_port: 80
                      firewall_rules:
                      - id: abcd123b93016eafb
                        port: 80
                        source: 198.51.100.0/24
                        ip_type: v4
                      instances: []
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: get-load-balancer
      description: Get information for a Load Balancer.
      security:
      - API Key: []
    patch:
      summary: Update Load Balancer
      tags:
      - load-balancer
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/load-balancers/{load-balancer-id}\" \\\n  -X PATCH \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\"\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"ssl\": {\n      \"private_key\": \"-----BEGIN RSA ... \",\n      \"certificate\": \"-----BEGIN RSA ... \",\n      \"chain\": \"-----BEGIN RSA ... \"\n    },\n    \"sticky_session\": {\n      \"cookie_name\": \"example-cookie\"\n    },\n    \"forwarding_rules\": [\n      {\n        \"frontend_protocol\": \"http\",\n        \"frontend_port\": 80,\n        \"backend_protocol\": \"http\",\n        \"backend_port\": 80\n      }\n    ],\n    \"health_check\": {\n      \"protocol\": \"http\",\n      \"port\": 80,\n      \"path\": \"/health\",\n      \"check_interval\": \"10\",\n      \"response_timeout\": \"5\",\n      \"unhealthy_threshold\": \"3\",\n      \"healthy_threshold\": \"3\"\n    },\n    \"proxy_protocol\": true,\n    \"ssl_redirect\": true,\n    \"balancing_algorithm\": \"roundrobin\",\n    \"instances\": [\n      \"73d85156c2c3129d\"\n    ]\n  }'"
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: update-load-balancer
      security:
      - API Key: []
      description: Update information for a Load Balancer. All attributes are optional. If not set, the attributes will retain their original values.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ssl:
                  type: object
                  description: An SSL certificate to install on the Load Balancer.
                  properties:
                    private_key:
                      type: string
                      description: The private key.
                    certificate:
                      type: string
                      description: The SSL certificate.
                    chain:
                      type: string
                      description: The certificate chain.
                sticky_session:
                  type: object
                  description: Enables sticky sessions for your load balancer when a cookie_name is provided.
                  properties:
                    cookie_name:
                      type: string
                      description: The cookie name to make sticky. See [Load Balancer documentation](https://www.vultr.com/docs/vultr-load-balancers#Load_Balancer_Configuration).
                forwarding_rules:
                  type: array
                  description: An array of forwarding rule objects.
                  items:
                    type: object
                    properties:
                      frontend_protocol:
                        type: string
                        description: 'The protocol on the Load Balancer to forward to the backend.


                          * HTTP

                          * HTTPS

                          * TCP'
                      frontend_port:
                        type: integer
                        description: The port number on the Load Balancer to forward to the backend.
                      backend_protocol:
                        type: string
                        description: 'The protocol destination on the backend server.


                          * HTTP

                          * HTTPS

                          * TCP'
                      backend_port:
                        type: integer
                        description: The port number destination on the backend server.
                health_check:
                  type: object
                  description: The health check configuration. [See Load Balancer documentation](https://www.vultr.com/docs/vultr-load-balancers#Load_Balancer_Configuration).
                  properties:
                    protocol:
                      type: string
                      description: 'The protocol to use for health checks.


                        * HTTPS

                        * HTTP

                        * TCP'
                    port:
                      type: integer
                      description: The port to use for health checks.
                    path:
                      type: string
                      description: HTTP Path to check. Only applies if protocol is HTTP or HTTPS.
                    check_interval:
                      type: string
                      description: Interval between health checks.
                    response_timeout:
                      type: string
                      description: Timeout before health check fails.
                    unhealthy_threshold:
                      type: string
                      description: Number times a check must fail before becoming unhealthy.
                    healthy_threshold:
                      type: string
                      description: Number of times a check must succeed before returning to healthy status.
                proxy_protocol:
                  type: boolean
                  description: 'If `true`, you must configure backend nodes to accept Proxy protocol.


                    * true

                    * false (Default)'
                ssl_redirect:
                  type: boolean
                  description: 'If `true`, this will redirect all HTTP traffic to HTTPS. You must have an HTTPS rule and SSL certificate installed on the load balancer to enable this option.


                    * true

                    * false'
                balancing_algorithm:
                  type: string
                  description: 'The balancing algorithm.


                    * roundrobin (default)

                    * leastconn'
                instances:
                  type: array
                  description: Send the complete array of Instances IDs that should be attached to this Load Balancer. Instances will be attached or detached to match your array. For example, if Instances **X**, **Y**, and **Z** are currently attached, and you send [A,B,Z], then Instance **A** and **B** will be attached,  **X** and **Y** will be detached, and **Z** will remain attached.
                  items:
                    type: string
                label:
                  type: string
                  description: The label for your Load Balancer
                private_network:
                  type: string
                  description: ID of the private network you wish to use. If private_network is omitted it will default to the public network.
                firewall_rules:
                  type: array
                  description: An array of firewall rule objects.
                  items:
                    type: object
                    properties:
                      port:
                        type: integer
                        description: Port for this rule.
                      source:
                        type: string
                        description: 'If the source string is given a value of "cloudflare" then cloudflare IPs will be supplied. Otherwise enter a IP address with subnet size that you wish to permit through the firewall.


                          Possible values:


                          |   | Value | Description |

                          | - | ------ | ------------- |

                          |   | "192.168.1.1/16" | Ip address with a subnet size. |

                          |   | cloudflare | Allow all of Cloudflare''s IP space through the firewall |'
                      ip_type:
                        type: string
                        description: 'The type of IP rule.


                          * v4

                          * v6'
            examples:
