openapi: 3.2.0
info:
  title: Vultr User Resources API
  version: 2.0.0
  contact:
    email: support@vultr.com
    url: https://www.vultr.com
  description: 'Operations tagged User Resources across 2 of this provider''s published API definitions: vultr-iam-management-api-openapi.yml, vultr-iam-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com
tags:
- name: User Resources
  description: Endpoints for viewing user-specific IAM resources (groups, roles, policies)
paths:
  /v2/users/me/groups:
    get:
      tags:
      - User Resources
      summary: List My Groups
      operationId: listMyGroups
      description: List all groups that the authenticated user belongs to
      parameters:
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: List of user's groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                    description: UUID of the authenticated user
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    servers:
    - url: https://api.vultr.com
  /v2/users/me/roles:
    get:
      tags:
      - User Resources
      summary: List My Roles
      operationId: listMyRoles
      description: List all roles assigned to the authenticated user (both direct and via groups)
      parameters:
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: List of user's roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                    description: UUID of the authenticated user
                  roles:
                    type: object
                    properties:
                      direct:
                        type: array
                        description: Roles directly assigned to the user
                        items:
                          $ref: '#/components/schemas/Role'
                      inherited:
                        type: array
                        description: Roles inherited from group memberships
                        items:
                          $ref: '#/components/schemas/Role'
                      all:
                        type: array
                        description: All roles (direct + inherited)
                        items:
                          $ref: '#/components/schemas/Role'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    servers:
    - url: https://api.vultr.com
  /v2/users/me/policies:
    get:
      tags:
      - User Resources
      summary: List My Policies
      operationId: listMyPolicies
      description: List all policies attached to the authenticated user (both direct and via roles/groups)
      parameters:
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: List of user's policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                    description: UUID of the authenticated user
                  policies:
                    type: object
                    properties:
                      direct:
                        type: array
                        description: Policies directly attached to the user
                        items:
                          $ref: '#/components/schemas/Policy'
                      inherited:
                        type: array
                        description: Policies inherited from group memberships
                        items:
                          $ref: '#/components/schemas/Policy'
                      from_roles:
                        type: array
                        description: Policies attached via roles
                        items:
                          $ref: '#/components/schemas/Policy'
                      all:
                        type: array
                        description: All policies (direct + inherited + from_roles)
                        items:
                          $ref: '#/components/schemas/Policy'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    servers:
    - url: https://api.vultr.com
  /v2/users/{user-id}/groups:
    get:
      tags:
      - User Resources
      summary: List User Groups
      operationId: listUserGroups
      description: List all groups that a specific user belongs to
      parameters:
      - name: user-id
        in: path
        required: true
        description: User UUID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: List of user's groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                    description: UUID of the user
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://api.vultr.com
  /v2/users/{user-id}/roles:
    get:
      tags:
      - User Resources
      summary: List User Roles
      operationId: listUserRoles
      description: List all roles assigned to a specific user (both direct and via groups)
      parameters:
      - name: user-id
        in: path
        required: true
        description: User UUID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: List of user's roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                    description: UUID of the user
                  roles:
                    type: object
                    properties:
                      direct:
                        type: array
                        description: Roles directly assigned to the user
                        items:
                          $ref: '#/components/schemas/Role'
                      inherited:
                        type: array
                        description: Roles inherited from group memberships
                        items:
                          $ref: '#/components/schemas/Role'
                      all:
                        type: array
                        description: All roles (direct + inherited)
                        items:
                          $ref: '#/components/schemas/Role'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://api.vultr.com
  /v2/users/{user-id}/policies:
    get:
      tags:
      - User Resources
      summary: List User Policies
      operationId: listUserPolicies
      description: List all policies attached to a specific user (both direct and via roles/groups)
      parameters:
      - name: user-id
        in: path
        required: true
        description: User UUID
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: List of user's policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                    description: UUID of the user
                  policies:
                    type: object
                    properties:
                      direct:
                        type: array
                        description: Policies directly attached to the user
                        items:
                          $ref: '#/components/schemas/Policy'
                      inherited:
                        type: array
                        description: Policies inherited from group memberships
                        items:
                          $ref: '#/components/schemas/Policy'
                      from_roles:
                        type: array
                        description: Policies attached via roles
                        items:
                          $ref: '#/components/schemas/Policy'
                      all:
                        type: array
                        description: All policies (direct + inherited + from_roles)
                        items:
                          $ref: '#/components/schemas/Policy'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://api.vultr.com
components:
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Unauthorized
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Not Found
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Forbidden
              message:
                type: string
                example: Not allowed to use IAM endpoints
  schemas:
    Policy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        policy_document:
          type: object
        version:
          type: string
        date_created:
          type: string
          format: date-time
        is_system_policy:
          type: boolean
          description: Whether this is a system-managed policy
    Group:
      type: object
      required:
      - id
      - display_name
      - date_created
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          description: Display name of the group
        description:
          type: string
        date_created:
          type: string
          format: date-time
        members:
          type: array
          items:
            type: object
          description: Group members (only included when not empty - typically not present in create response)
    Role:
      type: object
      required:
      - id
      - name
      - role_type
      - max_session_duration
      - date_created
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        role_type:
          type: string
          enum:
          - assumable
          - assignable
          description: Type of role
          example: assumable
        max_session_duration:
          type: integer
          minimum: 900
          maximum: 43200
          default: 3600
        date_created:
          type: string
          format: date-time
        policies:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
          description: Attached policies (only included when policies are attached)
    Meta:
      type: object
      description: Pagination metadata
      properties:
        total:
          type: integer
          description: Total number of items
        links:
          type: object
          properties:
            next:
              type: string
              description: Cursor for next page
            prev:
              type: string
              description: Cursor for previous page
  parameters:
    cursor:
      name: cursor
      in: query
      required: false
      description: Cursor for pagination
      schema:
        type: string
    per_page:
      name: per_page
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
x-refined-from:
- vultr-iam-management-api-openapi.yml
- vultr-iam-openapi.yml
