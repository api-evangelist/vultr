openapi: 3.2.0
info:
  title: Vultr private Networks API
  version: '2.0'
  description: 'Operations tagged private Networks across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: private Networks
  x-displayName: Private Networks
  description: Private Networks are fully isolated networks accessible only by instances on your account. Each private network is only available in one Region and cannot span across regions. An instance can connect to multiple private networks and you may have up to 5 private networks per region.
paths:
  /private-networks/{network-id}:
    parameters:
    - schema:
        type: string
      name: network-id
      in: path
      required: true
      description: The [Network id](#operation/list-networks).
    get:
      summary: Get a private network
      tags:
      - private Networks
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/private-networks/{network-id}\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  network:
                    $ref: '#/components/schemas/network'
              examples:
                response:
                  value:
                    network:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      region: ewr
                      description: Example Network Description
                      v4_subnet: 10.99.0.0
                      v4_subnet_mask: 24
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: get-network
      security:
      - API Key: []
      description: Get information about a Private Network.
    delete:
      summary: Delete a private network
      tags:
      - private Networks
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/private-networks/{network-id}\" \\\n  -X DELETE \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: delete-network
      description: Delete a Private Network.
      security:
      - API Key: []
    put:
      summary: Update a Private Network
      operationId: update-network
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      description: Update information for a Private Network.
      tags:
      - private Networks
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/private-networks/{network-id}\" \\\n  -X PUT \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"description\" : \"Example Private Network\"\n  }'"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: The Private Network description.
              required:
              - description
            examples:
              request:
                value:
                  description: Example Private Network
        description: Include a JSON object in the request body with a content type of **application/json**.
      security:
      - API Key: []
    servers:
    - url: https://api.vultr.com/v2
  /private-networks:
    get:
      summary: List Private Networks
      tags:
      - private Networks
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/private-networks\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  networks:
                    type: array
                    items:
                      $ref: '#/components/schemas/network'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                response:
                  value:
                    networks:
                    - id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      region: ewr
                      date_created: '2020-10-10T01:56:20+00:00'
                      description: Example Network Description
                      v4_subnet: 10.99.0.0
                      v4_subnet_mask: 24
                    meta:
                      total: 1
                      links:
                        next: ''
                        prev: ''
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: list-networks
      security:
      - API Key: []
      description: Get a list of all Private Networks in your account.
      parameters:
      - schema:
          type: integer
        in: query
        name: per_page
        description: Number of items requested per page. Default is 100 and Max is 500.
      - schema:
          type: string
        in: query
        name: cursor
        description: Cursor for paging. See [Meta and Pagination](#section/Introduction/Meta-and-Pagination).
    post:
      summary: Create a Private Network
      tags:
      - private Networks
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/private-networks\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"region\" : \"ewr\",\n    \"description\" : \"Example Private Network\",\n    \"v4_subnet\" : \"10.99.0.0\",\n    \"v4_subnet_mask\" : 24\n  }'"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  network:
                    $ref: '#/components/schemas/network'
              examples:
                response:
                  value:
                    network:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      region: ewr
                      description: Example Private Network
                      v4_subnet: 10.99.0.0
                      v4_subnet_mask: 24
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: create-network
      security:
      - API Key: []
      description: 'Create a new Private Network in a `region`. Private networks should use RFC1918 private address space:


        10.0.0.0 - 10.255.255.255 (10/8 prefix)

        172.16.0.0 - 172.31.255.255 (172.16/12 prefix)

        192.168.0.0 - 192.168.255.255 (192.168/16 prefix)'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                region:
                  type: string
                  description: Create the Private Network in this [Region id](#operation/list-regions).
                description:
                  type: string
                  description: A description of the private network.
                v4_subnet:
                  type: string
                  description: 'The IPv4 network address. For example: 10.99.0.0'
                v4_subnet_mask:
                  type: integer
                  description: 'The number of bits for the netmask in CIDR notation. Example: 24'
              required:
              - region
            examples:
              example:
                value:
                  region: ewr
                  description: Example Private Network
                  v4_subnet: 10.99.0.0
                  v4_subnet_mask: 24
        description: Include a JSON object in the request body with a content type of **application/json**.
    servers:
    - url: https://api.vultr.com/v2
