            next: next
            prev: prev
        domains:
        - date_created: date_created
          domain: domain
          dns_sec: dns_sec
        - date_created: date_created
          domain: domain
          dns_sec: dns_sec
      properties:
        domains:
          items:
            $ref: '#/components/schemas/domain_2'
          type: array
