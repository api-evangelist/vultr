openapi: 3.2.0
info:
  title: Vultr Baremetal API
  version: '2.0'
  description: 'Operations tagged baremetal across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: baremetal
  x-displayName: Bare Metal
  description: Bare Metal servers give you access to the underlying physical hardware in a single-tenant environment without a virtualization layer.
paths:
  /bare-metals:
    parameters: []
    get:
      summary: List Bare Metal Instances
      tags:
      - baremetal
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/bare-metals\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bare_metals:
                    type: array
                    items:
                      $ref: '#/components/schemas/baremetal'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                bare metal:
                  value:
                    bare_metals:
                    - id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      os: Application
                      ram: 32768 MB
                      disk: 2x 240GB SSD
                      main_ip: 192.0.2.123
                      cpu_count: 4
                      region: ams
                      default_password: example-password
                      date_created: '2020-10-10T01:56:20+00:00'
                      status: active
                      netmask_v4: 255.255.254.0
                      gateway_v4: 192.0.2.1
                      plan: vbm-4c-32gb
                      v6_network: '2001:0db8:5001:3990::'
                      v6_main_ip: 2001:0db8:5001:3990:0ec4:7aff:fe8e:f97a
                      v6_network_size: 64
                      label: Example Bare Metal
                      tag: Example Tag
                      mac_address: 2199756823533
                      os_id: 186
                      app_id: 3
                      image_id: ''
                      features:
                      - ipv6
                    meta:
                      total: 1
                      links:
                        next: ''
                        prev: ''
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: list-baremetals
      description: List all Bare Metal instances in your account.
      security:
      - API Key: []
      parameters:
      - schema:
          type: integer
        in: query
        name: per_page
        description: 'Number of items requested per page. Default is 100 and Max is 500.

          '
      - schema:
          type: string
        in: query
        name: cursor
        description: Cursor for paging. See [Meta and Pagination](#section/Introduction/Meta-and-Pagination).
    post:
      summary: Create Bare Metal Instance
      tags:
      - baremetal
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/bare-metals\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"region\" : \"ams\",\n    \"plan\" : \"vbm-4c-32gb\",\n    \"label\" : \"Example Bare Metal\",\n    \"app_id\" : 3,\n    \"enable_ipv6\" : true\n  }'"
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  baremetal:
                    $ref: '#/components/schemas/baremetal'
              examples:
                bare metal:
                  value:
                    baremetal:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      os: Application
                      ram: 32768 MB
                      disk: 2x 240GB SSD
                      main_ip: ''
                      cpu_count: 4
                      region: ams
                      date_created: '2020-10-10T01:56:20+00:00'
                      status: pending
                      netmask_v4: ''
                      gateway_v4: ''
                      plan: vbm-4c-32gb
                      v6_network: ''
                      v6_main_ip: ''
                      v6_network_size: 0
                      label: Example Bare Metal
                      mac_address: 2199756823533
                      tag: Example Tag
                      os_id: 186
                      app_id: 3
                      image_id: ''
                      features:
                      - ipv6
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: create-baremetal
      description: 'Create a new Bare Metal instance in a `region` with the desired `plan`. Choose one of the following to deploy the instance:


        * `os_id`

        * `snapshot_id`

        * `app_id`

        * `image_id`


        Supply other attributes as desired.'
      security:
      - API Key: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                region:
                  type: string
                  description: The [Region id](#operation/list-regions) to create the instance.
                plan:
                  type: string
                  description: The [Bare Metal plan id](#operation/list-metal-plans) to use for this instance.
                script_id:
                  type: string
                  description: The [Startup Script id](#operation/list-startup-scripts) to use for this instance.
                enable_ipv6:
                  type: boolean
                  description: 'Enable IPv6.


                    * true

                    * false'
                sshkey_id:
                  type: array
                  description: The [SSH Key id](#operation/list-ssh-keys) to install on this instance.
                  items:
                    type: string
                user_data:
                  type: string
                  description: The user-supplied, base64 encoded [user data](https://www.vultr.com/docs/manage-instance-user-data-with-the-vultr-metadata-api) for this Instance.
                label:
                  type: string
                  description: The user-supplied label.
                activation_email:
                  type: boolean
                  description: 'Notify by email after deployment.


                    * true

                    * false (default)'
                hostname:
                  type: string
                  description: The user-supplied hostname to use when deploying this instance.
                tag:
                  type: string
                  description: The user-supplied tag.
                reserved_ipv4:
                  type: string
                  description: The [Reserved IP id](#operation/list-reserved-ips) for this instance.
                os_id:
                  type: integer
                  description: If supplied, deploy the instance using this [Operating System id](#operation/list-os).
                snapshot_id:
                  type: string
                  description: If supplied, deploy the instance using this [Snapshot ID](#operation/list-snapshots).
                app_id:
                  type: integer
                  description: If supplied, deploy the instance using this [Application id](#operation/list-applications).
                image_id:
                  type: string
                  description: If supplied, deploy the instance using this [Application image_id](#operation/list-applications).
                persistent_pxe:
                  type: boolean
                  description: 'Enable persistent PXE.


                    * true

                    * false (default)'
              required:
              - region
              - plan
            examples:
              request:
                value:
                  region: ams
                  plan: vbm-4c-32gb
                  label: Example Bare Metal
                  app_id: 3
                  enable_ipv6: true
        description: Include a JSON object in the request body with a content type of **application/json**.
    servers:
    - url: https://api.vultr.com/v2
  /bare-metals/{baremetal-id}:
    parameters:
    - schema:
