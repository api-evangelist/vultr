        '404':
          description: Not Found
      operationId: get-baremetal
      security:
      - API Key: []
      description: Get information for a Bare Metal instance.
    patch:
      summary: Update Bare Metal
      tags:
      - baremetal
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/bare-metals/{baremetal-id}\" \\\n  -X PATCH \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"label\" : \"Updated Bare Metal Label\",\n    \"tag\" : \"Updated Tag\",\n    \"user_data\" : \"QmFzZTY0IEV4YW1wbGUgRGF0YQ==\"\n  }'"
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  bare_metal:
                    $ref: '#/components/schemas/baremetal'
              examples:
                example:
                  value:
                    bare_metal:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      os: Application
                      ram: 32768 MB
                      disk: 2x 240GB SSD
                      main_ip: 192.0.2.123
                      cpu_count: 4
                      region: ams
                      date_created: '2020-10-10T01:56:20+00:00'
                      status: pending
                      netmask_v4: 255.255.254.0
                      gateway_v4: 192.0.2.1
                      plan: vbm-4c-32gb
                      v6_network: '2001:0db8:5001:3990::'
                      v6_main_ip: 2001:0db8:5001:3990:0ec4:7aff:fe8e:f97a
                      v6_network_size: 64
                      mac_address: 2199756823533
                      label: Updated Bare Metal Label
                      tag: Updated Tag
                      os_id: 183
                      app_id: 3
                      image_id: ''
                      features:
                      - ipv6
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: update-baremetal
      description: 'Update a Bare Metal instance. All attributes are optional. If not set, the attributes will retain their original values.


        **Note:** Changing `os_id`, `app_id` or `image_id` may take a few extra seconds to complete.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_data:
                  type: string
                  description: The user-supplied, base64 encoded [user data](https://www.vultr.com/docs/manage-instance-user-data-with-the-vultr-metadata-api) to attach to this instance.
                label:
                  type: string
                  description: The user-supplied label.
                tag:
                  type: string
                  description: The user-supplied tag.
                os_id:
                  type: integer
                  description: If supplied, reinstall the instance using this [Operating System id](#operation/list-os).
                app_id:
                  type: integer
                  description: If supplied, reinstall the instance using this [Application id](#operation/list-applications).
                image_id:
                  type: string
                  description: If supplied, reinstall the instance using this [Application image_id](#operation/list-applications).
                enable_ipv6:
                  type: boolean
                  description: 'Enable IPv6.


                    * true

                    * false'
            examples:
              request:
                value:
                  label: Updated Bare Metal Label
                  tag: Updated Tag
                  user_data: QmFzZTY0IEV4YW1wbGUgRGF0YQ==
        description: Include a JSON object in the request body with a content type of **application/json**.
      security:
      - API Key: []
