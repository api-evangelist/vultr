openapi: 3.2.0
info:
  title: Vultr Users API
  version: '2.0'
  description: 'Operations tagged users across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: Users
  x-displayName: Users
  description: Vultr supports multiple users in each account, and each user has individual access permissions. Users have unique API keys, which respect the permission for that user.
paths:
  /users/{user-id}:
    parameters:
    - schema:
        type: string
      name: user-id
      in: path
      required: true
      description: The [User id](#operation/list-users).
    get:
      summary: Get User
      tags:
      - Users
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/users/{user-id}\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user'
              examples:
                user:
                  value:
                    user:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      email: user@example.com
                      api_enabled: true
                      acls:
                      - manage_users
                      - subscriptions_view
                      - subscriptions
                      - provisioning
                      - billing
                      - support
                      - abuse
                      - dns
                      - upgrade
                      - objstore
                      - loadbalancer
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: get-user
      description: Get information about a User.
      security:
      - API Key: []
    delete:
      summary: Delete User
      operationId: delete-user
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/users/{user-id}\" \\\n  -X DELETE \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      description: Delete a User.
      security:
      - API Key: []
      tags:
      - Users
    patch:
      summary: Update User
      operationId: update-user
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/users/{user-id}\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"email\" : \"user@example.com\",\n    \"name\" : \"Example User\",\n    \"password\" : \"example-password\",\n    \"api_enabled\" : true,\n    \"acls\" : [\n      \"manage_users\",\n      \"subscriptions_view\",\n      \"subscriptions\",\n      \"provisioning\",\n      \"billing\",\n      \"support\",\n      \"abuse\",\n      \"dns\",\n      \"upgrade\",\n      \"objstore\",\n      \"loadbalancer\"\n    ]\n  }'"
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: The User's email address.
                name:
                  type: string
                  description: The User's name.
                password:
                  type: string
                  description: The User's password.
                api_enabled:
                  type: boolean
                  description: 'API access is permitted for this User.


                    * true (default)

                    * false'
                acls:
                  type: array
                  description: 'An array of permission granted. Valid values:


                    * abuse

                    * alerts

                    * billing

                    * dns

                    * firewall

                    * loadbalancer

                    * manage\_users

                    * objstore

                    * provisioning

                    * subscriptions

                    * subscriptions\_view

                    * support

                    * upgrade'
                  items:
                    type: string
            examples:
              request:
                value:
                  email: user@example.com
                  name: Example User
                  password: example-password
                  api_enabled: true
                  acls:
                  - manage_users
                  - subscriptions_view
                  - subscriptions
                  - provisioning
                  - billing
                  - support
                  - abuse
                  - dns
                  - upgrade
                  - objstore
                  - loadbalancer
        description: Include a JSON object in the request body with a content type of **application/json**.
      description: Update information for a User. All attributes are optional. If not set, the attributes will retain their original values.
      security:
      - API Key: []
      tags:
      - Users
    servers:
    - url: https://api.vultr.com/v2
  /users:
    get:
      summary: Get Users
      tags:
      - Users
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/users\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/user'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                users:
                  value:
                    users:
                    - id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      email: user@example.com
                      api_enabled: true
                      acls:
                      - manage_users
                      - subscriptions_view
                      - subscriptions
                      - provisioning
                      - billing
                      - support
                      - abuse
                      - dns
                      - upgrade
                      - objstore
                      - loadbalancer
                    meta:
                      total: 1
                      links:
                        next: ''
                        prev: ''
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: list-users
      description: Get a list of all Users in your account.
      security:
      - API Key: []
      parameters:
      - schema:
          type: number
        in: query
        name: per_page
        description: Number of items requested per page. Default is 100 and Max is 500.
      - schema:
          type: string
        in: query
        name: cursor
        description: Cursor for paging. See [Meta and Pagination](#section/Introduction/Meta-and-Pagination).
    post:
      summary: Create User
      operationId: create-user
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/users\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"email\" : \"user@example.com\",\n    \"name\" : \"Example User\",\n    \"password\" : \"example-password\",\n    \"api_enabled\" : true,\n    \"acls\" : [\n      \"manage_users\",\n      \"subscriptions_view\",\n      \"subscriptions\",\n      \"provisioning\",\n      \"billing\",\n      \"support\",\n      \"abuse\",\n      \"dns\",\n      \"upgrade\",\n      \"objstore\",\n      \"loadbalancer\"\n    ]\n  }'"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user'
              examples:
                user:
                  value:
                    user:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      name: Example User
                      email: user@example.com
                      api_enabled: true
                      acls:
                      - manage_users
                      - subscriptions_view
                      - subscriptions
                      - provisioning
                      - billing
                      - support
                      - abuse
                      - dns
                      - upgrade
                      - objstore
                      - loadbalancer
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      description: Create a new User. The `email`, `name`, and `password` attributes are required.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: The User's email address.
                name:
                  type: string
                  description: The User's name.
                password:
                  type: string
                  description: The User's password.
                api_enabled:
                  type: boolean
                  description: 'API access is permitted for this User.


                    * true (default)

                    * false'
                acls:
                  type: array
                  description: 'An array of permissions granted.


                    * abuse

                    * alerts

                    * billing

                    * dns

                    * firewall

                    * loadbalancer

                    * manage\_users

                    * objstore

                    * provisioning

                    * subscriptions

                    * subscriptions\_view

                    * support

                    * upgrade'
                  items:
                    type: string
              required:
              - email
              - name
              - password
            examples:
              request example:
                value:
                  name: Example User
                  email: user@example.com
                  password: sh#sedHA_FTdz6w+
                  api_enabled: true
                  acls:
                  - manage_users
                  - subscriptions_view
                  - subscriptions
                  - provisioning
                  - billing
                  - support
                  - abuse
                  - dns
                  - upgrade
                  - objstore
                  - loadbalancer
        description: Include a JSON object in the request body with a content type of **application/json**.
      security:
      - API Key: []
      tags:
      - Users
    servers:
    - url: https://api.vultr.com/v2
