      tags:
      - Instances
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/instances/{instance-id}\" \\\n  -X DELETE \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
