                    |   | Value | Description |

                    | - | ------ | ------------- |

                    |   | 1 | Sunday |

                    |   | 2 | Monday |

                    |   | 3 | Tuesday |

                    |   | 4 | Wednesday |

                    |   | 5 | Thursday |

                    |   | 6 | Friday |

                    |   | 7 | Saturday |'
                  type: integer
                dom:
                  description: Day of month to run. Use values between 1 and 28.
                  type: integer
              required:
              - type
            examples:
              request:
                value:
