openapi: 3.2.0
info:
  title: Vultr Instances API
  version: '2.0'
  description: 'Operations tagged instances across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: Instances
  x-displayName: Instances
  description: Vultr Cloud instances can be deployed with your preferred operating system or pre-installed application in seconds. High Frequency Compute instances are powered by high clock speed CPU's and NVMe local storage to power your most demanding applications. Dedicated Cloud instances have dedicated CPU, SSD drives, and RAM.
paths:
  /instances:
    get:
      summary: List Instances
      tags:
      - Instances
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/instances\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items:
                      $ref: '#/components/schemas/instance'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                instance:
                  value:
                    instances:
                    - id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      os: CentOS SELinux 8 x64
                      ram: 2048
                      disk: 55
                      main_ip: 192.0.2.123
                      vcpu_count: 1
                      region: atl
                      plan: vc2-6c-16gb
                      date_created: '2020-10-10T01:56:20+00:00'
                      status: active
                      allowed_bandwidth: 2000
                      netmask_v4: 255.255.252.0
                      gateway_v4: 192.0.2.1
                      power_status: running
                      server_status: ok
                      v6_network: '2001:0db8:1112:18fb::'
                      v6_main_ip: 2001:0db8:1112:18fb:0200:00ff:fe00:0000
                      v6_network_size: 64
                      label: Example Instance
                      internal_ip: ''
                      kvm: https://my.vultr.com/subs/vps/novnc/api.php?data=00example11223344
                      hostname: my_hostname
                      tag: Example Tag
                      os_id: 215
                      app_id: 0
                      image_id: ''
                      firewall_group_id: ''
                      features:
                      - ddos_protection
                      - ipv6
                      - auto_backups
                    meta:
                      total: 3
                      links:
                        next: WxYzExampleNext
                        prev: ''
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: list-instances
      description: List all VPS instances in your account.
      security:
      - API Key: []
      parameters:
      - schema:
          type: integer
        in: query
        name: per_page
        description: Number of items requested per page. Default is 100 and Max is 500.
      - schema:
          type: string
        in: query
        name: cursor
        description: Cursor for paging. See [Meta and Pagination](#section/Introduction/Meta-and-Pagination).
      - schema:
          type: string
        in: query
        name: tag
        description: Filter by specific tag.
      - schema:
          type: string
        in: query
        name: label
        description: Filter by label.
      - schema:
          type: string
        in: query
        name: main_ip
        description: Filter by main ip address.
    post:
      summary: Create Instance
      tags:
      - Instances
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/instances\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"region\" : \"ewr\",\n    \"plan\" : \"vc2-6c-16gb\",\n    \"label\" : \"Example Instance\",\n    \"os_id\" : 215,\n    \"user_data\" : \"QmFzZTY0IEV4YW1wbGUgRGF0YQ==\",\n    \"backups\" : \"enabled\",\n    \"hostname\": \"my_hostname\"\n  }'"
      responses:
        '202':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance:
                    $ref: '#/components/schemas/instance'
              examples:
                instance:
                  value:
                    instance:
                      id: 4f0f12e5-1f84-404f-aa84-85f431ea5ec2
                      os: CentOS 8 Stream
                      ram: 1024
                      disk: 0
                      main_ip: 0.0.0.0
                      vcpu_count: 1
                      region: ewr
                      plan: vc2-1c-1gb
                      date_created: '2021-09-14T13:22:20+00:00'
                      status: pending
                      allowed_bandwidth: 1000
                      netmask_v4: ''
                      gateway_v4: 0.0.0.0
                      power_status: running
                      server_status: none
                      v6_network: ''
                      v6_main_ip: ''
                      v6_network_size: 0
                      label: ''
                      internal_ip: ''
                      kvm: ''
                      hostname: my_hostname
                      tag: ''
                      os_id: 401
                      app_id: 0
                      image_id: ''
                      firewall_group_id: ''
                      features: []
                      default_password: v5{Fkvb#2ycPGwHs
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: create-instance
      security:
      - API Key: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                region:
                  type: string
                  description: The [Region id](#operation/list-regions) where the Instance is located.
                plan:
                  type: string
                  description: The [Plan id](#operation/list-plans) to use when deploying this instance.
                os_id:
                  type: integer
                  description: The [Operating System id](#operation/list-os) to use when deploying this instance.
                ipxe_chain_url:
                  type: string
                  description: The URL location of the iPXE chainloader.
                iso_id:
                  type: string
                  description: The [ISO id](#operation/list-isos) to use when deploying this instance.
                script_id:
                  type: string
                  description: The [Startup Script id](#operation/list-startup-scripts) to use when deploying this instance.
                snapshot_id:
                  type: string
                  description: The [Snapshot id](#operation/list-snapshots) to use when deploying the instance.
                enable_ipv6:
                  type: boolean
                  description: 'Enable IPv6.


                    * true

                    * false'
                attach_private_network:
                  type: array
                  description: An array of [Private Network ids](#operation/list-networks) to attach to this Instance. This parameter takes precedence over `enable_private_network`. Please choose one parameter.
                  items:
                    type: string
                label:
                  type: string
                  description: A user-supplied label for this instance.
                sshkey_id:
                  type: array
                  description: The [SSH Key id](#operation/list-ssh-keys) to install on this instance.
                  items:
                    type: string
                backups:
                  type: string
                  description: 'Enable automatic backups for the instance.


                    * enabled

                    * disabled'
                app_id:
                  type: integer
                  description: The [Application id](#operation/list-applications) to use when deploying this instance.
                image_id:
                  type: string
                  description: The [Application image_id](#operation/list-applications) to use when deploying this instance.
                user_data:
                  type: string
                  description: The user-supplied, base64 encoded [user data](https://www.vultr.com/docs/manage-instance-user-data-with-the-vultr-metadata-api) to attach to this instance.
                ddos_protection:
                  type: boolean
                  description: 'Enable DDoS protection (there is an additional charge for this).


                    * true

                    * false'
                activation_email:
                  type: boolean
                  description: 'Notify by email after deployment.


                    * true

                    * false (default)'
                hostname:
                  type: string
                  description: The hostname to use when deploying this instance.
                tag:
                  type: string
                  description: The user-supplied tag.
                firewall_group_id:
                  type: string
                  description: The [Firewall Group id](#operation/list-firewall-groups) to attach to this Instance.
                reserved_ipv4:
                  type: string
                  description: ID of the floating IP to use as the main IP of this server.
                enable_private_network:
                  type: boolean
                  description: 'If `true`, private networking support will be added to the new server.


                    This parameter attaches a single network. When no network exists in the region, it will be automatically created.


                    If there are multiple private networks in the instance''s region, use `attach_private_network` instead to specify a network.'
              required:
              - region
              - plan
            examples:
              request:
                value:
                  region: ewr
                  plan: vc2-6c-16gb
                  label: Example Instance
                  os_id: 215
                  user_data: QmFzZTY0IEV4YW1wbGUgRGF0YQ==
                  backups: enabled
                  hostname: my_hostname
        description: Include a JSON object in the request body with a content type of **application/json**.
      description: 'Create a new VPS Instance in a `region` with the desired `plan`. Choose one of the following to deploy the instance:


        * `os_id`

        * `iso_id`

        * `snapshot_id`

        * `app_id`

        * `image_id`


        Supply other attributes as desired.'
    servers:
    - url: https://api.vultr.com/v2
  /instances/{instance-id}:
    parameters:
    - schema:
        type: string
      name: instance-id
      in: path
      required: true
      description: The [Instance ID](#operation/list-instances).
    get:
      summary: Get Instance
      tags:
      - Instances
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/instances/{instance-id}\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance:
                    $ref: '#/components/schemas/instance'
              examples:
                instance:
                  value:
                    instance:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      os: Ubuntu 20.04 x64
                      ram: 16384
                      disk: 384
                      main_ip: 192.0.2.123
                      vcpu_count: 4
                      region: ewr
                      plan: vc2-6c-16gb
                      date_created: '2020-10-10T01:56:20+00:00'
                      status: active
                      allowed_bandwidth: 5000
                      netmask_v4: 255.255.254.0
                      gateway_v4: 192.0.2.1
                      power_status: running
                      server_status: ok
                      v6_network: ''
                      v6_main_ip: ''
                      v6_network_size: 0
                      label: Example Instance
                      internal_ip: ''
                      kvm: https://my.vultr.com/subs/vps/novnc/api.php?data=00example11223344
                      hostname: my_hostname
                      tag: Example Tag
                      os_id: 215
                      app_id: 0
                      image_id: ''
                      firewall_group_id: ''
                      features:
                      - ddos_protection
                      - ipv6
                      - auto_backups
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: get-instance
      description: Get information about an Instance.
      security:
      - API Key: []
    patch:
      summary: Update Instance
      tags:
      - Instances
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/instances/{instance-id}\" \\\n  -X PATCH \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"label\" : \"Example Instance\",\n    \"tag\" : \"Example Tag\",\n    \"plan\" : \"vc2-24c-97gb\"\n  }'"
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance:
                    $ref: '#/components/schemas/instance'
              examples:
                example:
                  value:
                    instance:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      os: Ubuntu 20.04 x64
                      ram: 16384
                      disk: 384
                      main_ip: 192.0.2.123
                      vcpu_count: 4
                      region: ewr
                      plan: vc2-24c-97gb
                      date_created: '2020-10-10T01:56:20+00:00'
                      status: active
                      allowed_bandwidth: 5000
                      netmask_v4: 255.255.254.0
                      gateway_v4: 192.0.2.1
                      power_status: running
                      server_status: ok
                      v6_network: ''
                      v6_main_ip: ''
                      v6_network_size: 0
                      label: Example Instance
                      internal_ip: ''
                      kvm: https://my.vultr.com/subs/vps/novnc/api.php?data=00example11223344
                      hostname: my_hostname
                      tag: Example Tag
                      os_id: 215
                      app_id: 0
                      image_id: ''
                      firewall_group_id: ''
                      features:
                      - ddos_protection
                      - ipv6
                      - auto_backups
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: update-instance
      description: 'Update information for an Instance. All attributes are optional. If not set, the attributes will retain their original values.


        **Note:** Changing `os_id`, `app_id` or `image_id` may take a few extra seconds to complete.'
      security:
      - API Key: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                app_id:
                  type: integer
                  description: Reinstall the instance with this [Application id](#operation/list-applications).
                image_id:
                  type: string
                  description: Reinstall the instance with this [Application image_id](#operation/list-applications).
                backups:
                  description: 'Enable automatic backups for the instance.


                    * enable

                    * disable'
                  type: string
                firewall_group_id:
                  type: string
                  description: The [Firewall Group id](#operation/list-firewall-groups) to attach to this Instance.
                enable_ipv6:
                  type: boolean
                  description: 'Enable IPv6.


                    * true

                    * false'
                os_id:
                  type: string
                  description: Reinstall the instance with this [ISO id](#operation/list-isos).
                user_data:
                  type: string
                  description: The user-supplied, base64 encoded [user data](https://www.vultr.com/docs/manage-instance-user-data-with-the-vultr-metadata-api) to attach to this instance.
                tag:
                  type: string
                  description: The user-supplied tag.
                plan:
                  type: string
                  description: Upgrade the instance with this [Plan id](#operation/list-plans).
                ddos_protection:
                  description: 'Enable DDoS Protection (there is an additional charge for this).


                    * true

                    * false'
                  type: boolean
                attach_private_network:
                  type: array
                  description: An array of [Private Network ids](#operation/list-networks) to attach to this Instance. This parameter takes precedence over `enable_private_network`. Please choose one parameter.
                  items:
                    type: string
                detach_private_network:
                  type: array
                  description: An array of [Private Network ids](#operation/list-networks) to detach from this Instance. This parameter takes precedence over `enable_private_network`.
                  items:
                    type: string
                enable_private_network:
                  type: boolean
                  description: 'If `true`, private networking support will be added to the new server.


                    This parameter attaches a single network. When no network exists in the region, it will be automatically created.


                    If there are multiple private networks in the instance''s region, use `attach_private_network` instead to specify a network.'
                label:
                  type: string
                  description: The user supplied label
            examples:
              request:
                value:
                  label: Example Instance
                  tag: Example Tag
                  plan: vc2-24c-97gb
        description: Include a JSON object in the request body with a content type of **application/json**.
    delete:
