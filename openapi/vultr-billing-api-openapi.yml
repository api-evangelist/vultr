      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/billing/invoices/{invoice-id}/items\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
    servers:
    - url: https://api.vultr.com/v2
