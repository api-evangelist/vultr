openapi: 3.2.0
info:
  title: Vultr Billing API
  version: '2.0'
  description: 'Operations tagged billing across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: Billing
  x-displayName: Billing
  description: Read-only billing information for your user account.
paths:
  /billing/history:
    parameters: []
    get:
      summary: List Billing History
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  billing_history:
                    $ref: '#/components/schemas/billing'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                example-1:
                  value:
                    billing_history:
                    - id: 123456
                      date: '2020-10-10T01:56:20+00:00'
                      type: invoice
                      description: 'Invoice #123456'
                      amount: 100.03
                      balance: 79.48
                    - id: 123457
                      date: '2020-10-10T01:46:05+00:00'
                      type: credit
                      description: Account Credit
                      amount: 50.55
                      balance: -20.55
                    meta:
                      total: 3
                      links:
                        next: WxYzExampleNext
                        prev: ''
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        ? ''
        : content:
            application/json:
              schema:
                type: object
                properties:
                  billing:
                    $ref: ''
      operationId: list-billing-history
      description: Retrieve list of billing history
      security:
      - API Key: []
      tags:
      - Billing
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/billing/history\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
    servers:
    - url: https://api.vultr.com/v2
  /billing/invoices:
    parameters: []
    get:
      summary: List Invoices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: ''
                type: object
                x-examples:
                  example-1:
                    billing_invoice:
                    - id: 123456
                      billing_period: 09-01-2021
                      amount: 5
                properties:
                  billing_invoices:
                    type: array
                    items:
                      $ref: '#/components/schemas/invoice'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                example-1:
                  value:
                    billing_invoices:
                    - id: 123456
                      date: '2021-10-10T00:00:00+00:00'
                      description: 'Invoice #123456'
                      amount: 5.25
                      balance: 10.25
                    meta:
                      total: 1
                      links:
                        next: ''
                        prev: ''
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        ? ''
        : content:
            application/json:
              schema:
                type: object
                properties:
                  invoice:
                    $ref: ''
              examples:
                example-1:
                  billing_history: null
      operationId: list-invoices
      description: Retrieve full specified invoice
      security:
      - API Key: []
      tags:
      - Billing
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/billing/invoices/{invoice-id}\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
    servers:
    - url: https://api.vultr.com/v2
  /billing/invoices/{invoice-id}:
    parameters:
    - schema:
        type: string
      name: invoice-id
      in: path
      required: true
    get:
      summary: Get Invoice
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: ''
                type: object
                x-examples:
                  example-1:
                    billing_invoice:
                      id: 123456
                      description: Account Credit
                      billing_period: 09-01-2021
                      amount: 5
                properties:
                  billing_invoice:
                    $ref: '#/components/schemas/invoice'
              examples:
                example-1:
                  value:
                    billing_invoice:
                      id: 123456
                      description: Account Credit
                      date: 09-01-2021T00:00:00+00:00
                      amount: 5.25
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        ? ''
        : content:
            application/json:
              schema:
                type: object
                properties:
                  invoice:
                    $ref: ''
              examples:
                example-1:
                  billing_history: null
      operationId: get-invoice
      description: Retrieve specified invoice
      security:
      - API Key: []
      tags:
      - Billing
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/billing/invoices/{invoice-id}\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
    servers:
    - url: https://api.vultr.com/v2
  /billing/invoices/{invoice-id}/items:
    parameters:
    - schema:
        type: string
      name: invoice-id
      in: path
      required: true
    get:
      summary: Get Invoice Items
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: ''
                type: object
                x-examples:
                  example-1:
                    invoice_items:
                    - description: Load Balancer (my-loadbalancer)
                      product: Load Balancer
                      start_date: '2021-08-31 20:00:00'
                      end_date: '2021-09-30 20:00:00'
                      units: 720
                      unit_type: hours
                      unit_price: 0.0149
                      total: 10
                    - description: 1.1.1.1 (8192 MB) [my-instance]
                      product: Vultr Cloud Compute
                      start_date: '2021-09-15 09:13:15'
                      end_date: '2021-09-30 20:00:00'
                      units: 371
                      unit_type: hours
                      unit_price: 0.0595
                      total: 22.09
                    meta:
                      total: 3
                      links:
                        next: WxYzExampleNext
                        prev: ''
                properties:
                  invoice_items:
                    type: array
                    items:
                      type: object
                      properties:
                        description:
                          type: string
                          description: Invoice item description
                        product:
                          type: string
                          description: Product name
                        start_date:
                          type: string
                          description: Start date of item
                        end_date:
                          type: string
                          description: End date of item
                        units:
                          type: number
                          description: Number of units item consumed in billing period
                        unit_type:
                          type: string
                          description: Unit type. Options include "hours", "overage", and "discount"
                        unit_price:
                          type: number
                          description: Price per unit in dollars
                        total:
                          type: number
                          description: Total amount due in dollars
                  meta:
                    type: object
                    properties:
                      total:
                        type: number
                      links:
                        type: object
                        properties:
                          next:
                            type: string
                          prev:
                            type: string
              examples:
                example-1:
                  value:
                    invoice_items:
                    - description: Load Balancer (my-loadbalancer)
                      product: Load Balancer
                      start_date: '2021-08-31T00:00:00+00:00'
                      end_date: '2021-09-30T00:00:00+00:00'
                      units: 720
                      unit_type: hours
                      unit_price: 0.0149
                      total: 10
                    - description: 1.1.1.1 (8192 MB) [my-instance]
                      product: Vultr Cloud Compute
                      start_date: '2021-09-15T00:00:00+00:00'
                      end_date: '2021-09-30T00:00:00+00:00'
                      units: 371
                      unit_type: hours
                      unit_price: 0.0595
                      total: 22.09
                    meta:
                      total: 3
                      links:
                        next: WxYzExampleNext
                        prev: ''
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        ? ''
        : content:
            application/json:
              schema:
                type: object
                properties:
                  invoice:
                    $ref: ''
              examples:
                example-1:
                  billing_history: null
      operationId: get-invoice-items
      description: Retrieve full specified invoice
      security:
      - API Key: []
      tags:
