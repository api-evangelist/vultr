openapi: 3.2.0
info:
  title: Vultr Block API
  version: '2.0'
  description: 'Operations tagged block across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: Block
  x-displayName: Block Storage
  description: Block Storage volumes are highly-available, redundant, SSD backed, and expandable from 10 GB to 10,000 GB. Block storage volumes can be formatted with your choice of filesystems and moved between server instances as needed. See our FAQ for details.
paths:
  /blocks:
    parameters: []
    get:
      summary: List Block storages
      tags:
      - Block
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/blocks\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocks:
                    type: array
                    items:
                      $ref: '#/components/schemas/blockstorage'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                block storage list:
                  value:
                    blocks:
                    - id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      cost: 5
                      status: pending
                      size_gb: 50
                      region: ewr
                      attached_to_instance: 742c9913-d088-4d67-bc61-5a10e922fbd1
                      label: Example Block Storage
                      mount_id: ewr-example112233
                    meta:
                      total: 1
                      links:
                        next: ''
                        prev: ''
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
      operationId: list-blocks
      description: List all Block Storage in your account.
      security:
      - API Key: []
      parameters:
      - schema:
          type: integer
        in: query
        name: per_page
        description: Number of items requested per page. Default is 100 and Max is 500.
      - schema:
          type: string
        in: query
        name: cursor
        description: Cursor for paging. See [Meta and Pagination](#section/Introduction/Meta-and-Pagination).
    post:
      summary: Create Block Storage
      operationId: create-block
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  block:
                    $ref: '#/components/schemas/blockstorage'
              examples:
                created block storage:
                  value:
                    block:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      cost: 5
                      status: active
                      size_gb: 50
                      region: ewr
                      attached_to_instance: 742c9913-d088-4d67-bc61-5a10e922fbd1
                      label: Example Block Storage
                      mount_id: ewr-example112233
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      description: Create new Block Storage in a `region` with a size of `size_gb`. Size may range between 10 and 10000.
      security:
      - API Key: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                region:
                  type: string
                  description: The [Region id](#operation/list-regions) where the Block Storage will be created.
                size_gb:
                  type: integer
                  description: Size in GB may range between 10 and 10000.
                label:
                  type: string
                  description: The user-supplied label.
              required:
              - region
              - size_gb
            examples:
              request:
                value:
                  region: ewr
                  size_gb: 50
                  label: Example Block Storage
        description: Include a JSON object in the request body with a content type of **application/json**.
      tags:
      - Block
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/blocks\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"region\" : \"ewr\",\n    \"size_gb\" : 50,\n    \"label\" : \"Example Block Storage\"\n  }'"
    servers:
    - url: https://api.vultr.com/v2
  /blocks/{block-id}:
    parameters:
    - schema:
        type: string
      name: block-id
      in: path
      required: true
      description: The [Block Storage id](#operation/list-blocks).
    get:
      summary: Get Block Storage
      tags:
      - Block
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/blocks/{block-id}\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  block:
                    $ref: '#/components/schemas/blockstorage'
              examples:
                single block storage:
                  value:
                    block:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      cost: 5
                      status: active
                      size_gb: 50
                      region: ewr
                      attached_to_instance: 742c9913-d088-4d67-bc61-5a10e922fbd1
                      label: Example Block Storage
                      mount_id: ewr-example112233
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      operationId: get-block
      description: Get information for Block Storage.
      security:
      - API Key: []
    delete:
      summary: Delete Block Storage
      tags:
      - Block
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/blocks/{block-id}\" \\\n  -X DELETE \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: delete-block
      description: Delete Block Storage.
      security:
      - API Key: []
    patch:
      summary: Update Block Storage
      tags:
      - Block
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/blocks/{block-id}\" \\\n  -X PATCH \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"label\" : \"Updated Block Storage Label\",\n    \"size_gb\": 50\n  }'"
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: update-block
      description: Update information for Block Storage.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: The user-supplied label.
                size_gb:
                  type: integer
                  description: New size of the Block Storage in GB. Size may range between 10 and 10000.
            examples:
              patch request:
                value:
                  label: Updated Block Storage Label
                  size_gb: 50
        description: Include a JSON object in the request body with a content type of **application/json**.
      security:
      - API Key: []
    servers:
    - url: https://api.vultr.com/v2
  /blocks/{block-id}/attach:
    parameters:
    - schema:
        type: string
      name: block-id
      in: path
      required: true
      description: The [Block Storage id](#operation/list-blocks).
    post:
      summary: Attach Block Storage
      tags:
      - Block
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/blocks/{block-id}/attach\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"instance_id\" : \"a632673e-2fd5-4ff1-b251-2e28e7b65504\",\n    \"live\" : true\n  }'"
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: attach-block
      description: Attach Block Storage to Instance `instance_id`.
      security:
      - API Key: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instance_id:
                  description: Attach the Block Storage to this [Instance id](#operation/list-instances).
                  type: string
                live:
                  type: boolean
                  description: 'Attach Block Storage without restarting the Instance.


                    |   | Value | Description |

                    | - | ----- | ----------- |

                    |   | true | Attach live, do not restart the instance. |

                    |   | false | Restart the instance and attach the Block Storage. |'
              required:
              - instance_id
            examples:
              post request:
                value:
                  instance_id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                  live: true
        description: Include a JSON object in the request body with a content type of **application/json**.
    servers:
    - url: https://api.vultr.com/v2
  /blocks/{block-id}/detach:
    parameters:
    - schema:
        type: string
      name: block-id
      in: path
      required: true
      description: The [Block Storage id](#operation/list-blocks).
    post:
      summary: Detach Block Storage
      tags:
      - Block
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/blocks/{block-id}/detach\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"live\" : true\n  }'"
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: detach-block
      security:
      - API Key: []
      description: Detach Block Storage.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                live:
                  type: boolean
                  description: 'Detach Block Storage without restarting the Instance.


                    |   | Value | Description |

                    | - | ----- | ----------- |

                    |   | true | Detach live, do not restart the instance. |

                    |   | false | Restart the instance and detach the Block Storage. |'
            examples:
              post request:
                value:
                  live: true
        description: Include a JSON object in the request body with a content type of **application/json**.
    servers:
    - url: https://api.vultr.com/v2
