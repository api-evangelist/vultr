openapi: 3.2.0
info:
  title: Vultr Backup API
  version: '2.0'
  description: 'Operations tagged backup across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: Backup
  x-displayName: Backups
  description: A backup is a scheduled, automatic, point-in-time image of an instance. We do not stop the instance when taking a backup. Booting from a backup is similar to rebooting after a non-graceful restart. Snapshots are physically the same as backups, but snapshots are manual while backups run automatically on a schedule. Backups can be converted into snapshots. See our Automatic Backup FAQ for more information.
paths:
  /backups:
    get:
      summary: List Backups
      tags:
      - Backup
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/backups\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  backups:
                    type: array
                    items:
                      $ref: '#/components/schemas/backup'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                response:
                  value:
                    backups:
                    - id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      description: Example Automatic Backup
                      size: 10000000
                      status: complete
                    meta:
                      total: 1
                      links:
                        next: ''
                        prev: ''
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: list-backups
      description: Get information about Backups in your account. You can filter the list by `instance_id`.
      parameters:
      - schema:
          type: string
        in: query
        name: instance_id
        description: Filter the backup list by [Instance id](#operation/list-instances).
      - schema:
          type: integer
        in: query
        name: per_page
        description: Number of items requested per page. Default is 100 and Max is 500.
      - schema:
          type: string
        in: query
        name: cursor
        description: Cursor for paging. See [Meta and Pagination](#section/Introduction/Meta-and-Pagination).
      security:
      - API Key: []
    servers:
    - url: https://api.vultr.com/v2
  /backups/{backup-id}:
    parameters:
    - schema:
        type: string
      name: backup-id
      in: path
      required: true
      description: The [Backup id](#operation/list-backups).
    get:
      summary: Get a Backup
      tags:
      - Backup
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/backups/{backup-id}\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup:
                    $ref: '#/components/schemas/backup'
              examples:
                backup:
                  value:
                    backup:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      description: Example Description
                      size: 10000000
                      status: complete
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: get-backup
      security:
      - API Key: []
      description: Get the information for the Backup.
    servers:
    - url: https://api.vultr.com/v2
