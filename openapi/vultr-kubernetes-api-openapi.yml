info:
  title: Vultr Kubernetes API
  version: '2.0'
  description: 'Operations tagged kubernetes across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
