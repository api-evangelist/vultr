openapi: 3.2.0
info:
  title: Vultr Application API
  version: '2.0'
  description: 'Operations tagged application across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: Application
  x-displayName: Applications
  description: 'One-Click and Marketplace Applications are ready-to-run with minimal configuration. We have an extensive documentation library for our Applications.


    There are two types of Applications: `marketplace` and `one-click`. This is denoted by the `type` field in the Application object. Applications with `type` of `marketplace` can be deployed by using the `image_id` while Applications with `type` of `one-click` should use the `id`.'
paths:
  /applications:
    get:
      summary: List Applications
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/applications\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: ''
                properties:
                  applications:
                    type: array
                    description: ''
                    items:
                      $ref: '#/components/schemas/application'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                response:
                  value:
                    applications:
                    - id: 1
                      name: LEMP
                      short_name: lemp
                      deploy_name: LEMP on CentOS 6 x64
                      type: one-click
                      vendor: vultr
                      image_id: ''
                    - id: 1028
                      name: OpenLiteSpeed WordPress
                      short_name: openlitespeedwordpress
                      deploy_name: OpenLiteSpeed WordPress on Ubuntu 20.04 x64
                      type: marketplace
                      vendor: LiteSpeed_Technologies
                      image_id: openlitespeed-wordpress
                    meta:
                      total: 2
                      links:
                        next: ''
                        prev: ''
      operationId: list-applications
      description: Get a list of all available Applications. This list can be filtered by `type`.
      tags:
      - Application
      parameters:
      - schema:
          type: string
        in: query
        name: type
        description: 'Filter the results by type.


          |   | Type | Description |

          | - | ------ | ------------- |

          |   | all | All available application types |

          |   | marketplace | Marketplace applications |

          |   | one-click | Vultr One-Click applications |'
      - schema:
          type: integer
        in: query
        name: per_page
        description: Number of items requested per page. Default is 100 and Max is 500.
      - schema:
          type: string
        in: query
        name: cursor
        description: Cursor for paging. See [Meta and Pagination](#section/Introduction/Meta-and-Pagination).
      security: []
    servers:
    - url: https://api.vultr.com/v2
