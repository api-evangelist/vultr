openapi: 3.2.0
info:
  title: Vultr Plans API
  version: '2.0'
  description: 'Operations tagged plans across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: Plans
  x-displayName: Plans
  description: A Plan is a particular configuration of vCPU, RAM, SSD, and bandwidth to deploy an Instance. Not all Plans are available in all Regions. You can browse plans in the Customer Portal or get a list of Plans from the API.
paths:
  /plans:
    get:
      summary: List Plans
      tags:
      - Plans
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/plans\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/plans'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                response:
                  value:
                    plans:
                    - id: vhf-8c-32gb
                      vcpu_count: 8
                      ram: 32768
                      disk: 512
                      disk_count: 1
                      bandwidth: 6144
                      monthly_cost: 192
                      type: vhf
                      locations:
                      - sea
                    meta:
                      total: 1
                      links:
                        next: ''
                        prev: ''
      operationId: list-plans
      description: Get a list of all VPS plans at Vultr. The list can be filtered by `type`.
      parameters:
      - schema:
          type: string
        in: query
        name: type
        description: 'Filter the results by type.


          |   | Type | Description |

          | - | ------ | ------------- |

          |   | all | All available plan types |

          |   | vc2 | Cloud Compute |

          |   | vhf | High Frequency Compute |

          |   | vdc | Dedicated Cloud |'
      - schema:
          type: integer
        in: query
        name: per_page
        description: Number of items requested per page. Default is 100 and Max is 500.
      - schema:
          type: string
        in: query
        name: cursor
        description: Cursor for paging. See [Meta and Pagination](#section/Introduction/Meta-and-Pagination).
      - schema:
          type: string
        in: query
        name: os
        description: 'Filter the results by operating system.


          |   | Type | Description |

          | - | ------ | ------------- |

          |   | windows | All available plans that support windows |'
      security: []
    servers:
    - url: https://api.vultr.com/v2
  /plans-metal:
    get:
      summary: List Bare Metal Plans
      tags:
      - Plans
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/plans-metal\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/plans-metal'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                bare metal:
                  value:
                    plans_metal:
                    - id: vbm-4c-32gb
                      cpu_count: 4
                      cpu_threads: 8
                      cpu_model: E3-1270v6
                      ram: 32768
                      disk: 240
                      disk_count: 2
                      bandwidth: 5120
                      monthly_cost: 300
                      type: SSD
                      locations:
                      - ewr
                    meta:
                      total: 1
                      links:
                        next: ''
                        prev: ''
      operationId: list-metal-plans
      description: Get a list of all Bare Metal plans at Vultr.
      parameters:
      - schema:
          type: string
        in: query
        name: per_page
        description: Number of items requested per page. Default is 100 and Max is 500.
      - schema:
          type: string
        in: query
        name: cursor
        description: Cursor for paging. See [Meta and Pagination](#section/Introduction/Meta-and-Pagination).
      security: []
    servers:
    - url: https://api.vultr.com/v2
