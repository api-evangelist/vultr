openapi: 3.2.0
info:
  title: Vultr Firewall API
  version: '2.0'
  description: 'Operations tagged firewall across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: Firewall
  x-displayName: Firewall
  description: Vultr offers a web-based firewall solution to protect one or more compute instances. Firewall groups can manage multiple servers with a standard ruleset. You can control multiple groups with the API.
paths:
  /firewalls:
    parameters: []
    get:
      summary: List Firewall Groups
      tags:
      - Firewall
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/firewalls\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  firewall_groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/firewall-group'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                response:
                  value:
                    firewall_groups:
                    - id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      description: Example Firewall Group
                      date_created: '2020-10-10T01:56:20+00:00'
                      date_modified: '2020-10-10T01:59:20+00:00'
                      instance_count: 0
                      rule_count: 0
                      max_rule_count: 50
                    meta:
                      total: 1
                      links:
                        next: ''
                        prev: ''
        '401':
          description: Unauthorized
      operationId: list-firewall-groups
      description: Get a list of all Firewall Groups.
      security:
      - API Key: []
      parameters:
      - schema:
          type: integer
        in: query
        name: per_page
        description: Number of items requested per page. Default is 100 and Max is 500.
      - schema:
          type: string
        in: query
        name: cursor
        description: Cursor for paging. See [Meta and Pagination](#section/Introduction/Meta-and-Pagination).
    post:
      summary: Create Firewall Group
      tags:
      - Firewall
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/firewalls\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"description\" : \"Example Firewall Group\"\n  }'"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  firewall_group:
                    $ref: '#/components/schemas/firewall-group'
              examples:
                response:
                  value:
                    firewall_group:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      description: Example Firewall Group
                      date_created: '2020-10-10T01:56:20+00:00'
                      date_modified: '2020-10-10T01:56:20+00:00'
                      instance_count: 0
                      rule_count: 0
                      max_rule_count: 50
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: create-firewall-group
      description: Create a new Firewall Group.
      security:
      - API Key: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: User-supplied description of this Firewall Group.
            examples:
              request:
                value:
                  description: Example Firewall Group
        description: Include a JSON object in the request body with a content type of **application/json**.
    servers:
    - url: https://api.vultr.com/v2
  /firewalls/{firewall-group-id}:
    parameters:
    - schema:
        type: string
      name: firewall-group-id
      in: path
      required: true
      description: The [Firewall Group id](#operation/list-firewall-groups).
    get:
      summary: Get Firewall Group
      tags:
      - Firewall
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/firewalls/{firewall-group-id}\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  firewall_group:
                    $ref: '#/components/schemas/firewall-group'
              examples:
                response:
                  value:
                    firewall_group:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      description: Example Firewall Group
                      date_created: '2020-10-10T01:56:20+00:00'
                      date_modified: '2020-10-10T01:56:20+00:00'
                      instance_count: 0
                      rule_count: 0
                      max_rule_count: 50
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: get-firewall-group
      description: Get information for a Firewall Group.
      security:
      - API Key: []
    put:
      summary: Update Firewall Group
      tags:
      - Firewall
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/firewalls/{firewall-group-id}\" \\\n  -X PUT \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"description\" : \"Updated Firewall Group Name\"\n  }'"
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: update-firewall-group
      description: Update information for a Firewall Group.
      security:
      - API Key: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: User-supplied description of this Firewall Group.
              required:
              - description
            examples:
              request:
                value:
                  description: Updated Firewall Group Name
        description: Include a JSON object in the request body with a content type of **application/json**.
    delete:
      summary: Delete Firewall Group
      tags:
      - Firewall
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/firewalls/{firewall-group-id}\" \\\n  -X DELETE \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: delete-firewall-group
      security:
      - API Key: []
      description: Delete a Firewall Group.
    servers:
    - url: https://api.vultr.com/v2
  /firewalls/{firewall-group-id}/rules:
    parameters:
    - schema:
        type: string
      name: firewall-group-id
      in: path
      required: true
      description: The [Firewall Group id](#operation/list-firewall-groups).
    get:
      summary: List Firewall Rules
      tags:
      - Firewall
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/firewalls/{firewall-group-id}/rules\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  firewall_rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/firewall-rule'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                response:
                  value:
                    firewall_rules:
                    - id: 1
                      ip_type: v4
                      action: accept
                      protocol: tcp
                      port: '80'
                      subnet: 192.0.2.0
                      subnet_size: 24
                      source: ''
                      notes: Example Firewall Rule
                    meta:
                      total: 1
                      links:
                        next: ''
                        prev: ''
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: list-firewall-group-rules
      description: Get the Firewall Rules for a Firewall Group.
      security:
      - API Key: []
      parameters:
      - schema:
          type: integer
        in: query
        name: per_page
        description: Number of items requested per page. Default is 100 and Max is 500.
      - schema:
          type: string
        in: query
        name: cursor
        description: Cursor for paging. See [Meta and Pagination](#section/Introduction/Meta-and-Pagination).
    post:
      summary: Create Firewall Rules
      tags:
      - Firewall
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/firewalls/{firewall-group-id}/rules\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"ip_type\" : \"v4\",\n    \"protocol\" : \"tcp\",\n    \"port\" : \"80\",\n    \"subnet\" : \"192.0.2.0\",\n    \"subnet_size\" : 24,\n    \"source\" : \"\",\n    \"notes\" : \"Example Firewall Rule\"\n  }'"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  firewall_rule:
                    $ref: '#/components/schemas/firewall-rule'
              examples:
                response:
                  value:
                    firewall_rule:
                      id: 1
                      ip_type: v4
                      action: accept
                      protocol: tcp
                      port: '80'
                      subnet: 192.0.2.0
                      subnet_size: 24
                      source: ''
                      notes: Example Firewall Rule
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: post-firewalls-firewall-group-id-rules
      description: Create a Firewall Rule for a Firewall Group. The attributes `ip_type`, `protocol`, `subnet`, and `subnet_size` are required.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ip_type:
                  type: string
                  description: 'The type of IP rule.


                    * v4

                    * v6'
                protocol:
                  type: string
                  description: 'The protocol for this rule.


                    * ICMP

                    * TCP

                    * UDP

                    * GRE

                    * ESP

                    * AH

                    '
                subnet:
                  type: string
                  description: 'The IPv4 network in CIDR notation. Example: 192.0.2.123'
                subnet_size:
                  type: integer
                  description: 'The number of bits for the netmask in CIDR notation. Example: 32'
                port:
                  type: string
                  description: TCP/UDP only. This field can be a specific port or a colon separated port range.
                source:
                  type: string
                  description: 'If the source string is given a value of "cloudflare" subnet and subnet_size will both be ignored.

                    Possible values:


                    |   | Value | Description |

                    | - | ------ | ------------- |

                    |   | "" | Use the value from `subnet` and `subnet_size`. |

                    |   | cloudflare | Allow all of Cloudflare''s IP space through the firewall |

                    |   | [Load Balancer id](#operation/list-load-balancers) | Provide a load balancer ID to use its IPs |

                    '
                notes:
                  type: string
                  description: User-supplied notes for this rule.
              required:
              - ip_type
              - protocol
              - subnet
              - subnet_size
            examples:
              request:
                value:
                  ip_type: v4
                  protocol: tcp
                  port: '80'
                  subnet: 192.0.2.0
                  subnet_size: 24
                  source: ''
                  notes: Example Firewall Rule
        description: Include a JSON object in the request body with a content type of **application/json**.
      security:
      - API Key: []
    servers:
    - url: https://api.vultr.com/v2
  /firewalls/{firewall-group-id}/rules/{firewall-rule-id}:
    parameters:
    - schema:
        type: string
      name: firewall-group-id
      in: path
      required: true
      description: The [Firewall Group id](#operation/list-firewall-groups).
    - schema:
        type: string
      name: firewall-rule-id
      in: path
      required: true
      description: The [Firewall Rule id](#operation/list-firewall-group-rules).
    delete:
      summary: Delete Firewall Rule
      tags:
