openapi: 3.2.0
info:
  title: Vultr Iso API
  version: '2.0'
  description: 'Operations tagged iso across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: iso
  x-displayName: ISO
  description: Upload and boot instances from your ISO, or choose one from our public ISO library. See our ISO documentation.
paths:
  /iso:
    get:
      summary: List ISOs
      tags:
      - iso
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/iso\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  isos:
                    type: array
                    items:
                      $ref: '#/components/schemas/iso'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                response:
                  value:
                    isos:
                    - id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      filename: my-iso.iso
                      size: 120586240
                      md5sum: 77ba289bdc966ec996278a5a740d96d8
                      sha512sum: 2b31b6fcab34d6ea9a6b293601c39b90cb044e5679fcc5
                      status: complete
                    meta:
                      total: 1
                      links:
                        next: ''
                        prev: ''
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: list-isos
      description: Get the ISOs in your account.
      security:
      - API Key: []
      parameters:
      - schema:
          type: integer
        in: query
        name: per_page
        description: Number of items requested per page. Default is 100 and Max is 500.
      - schema:
          type: string
        in: query
        name: cursor
        description: Cursor for paging. See [Meta and Pagination](#section/Introduction/Meta-and-Pagination).
    post:
      summary: Create ISO
      tags:
      - iso
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/iso\" \\\n  -X POST \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data '{\n    \"url\" : \"https://example.com/my-iso.iso\"\n  }'"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  iso:
                    $ref: '#/components/schemas/iso'
              examples:
                response:
                  value:
                    iso:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      filename: my-iso.iso
                      status: pending
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: create-iso
      description: Create a new ISO in your account from `url`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: 'Public URL location of the ISO image to download. Example: https://example.com/my-iso.iso'
              required:
              - url
            examples:
              request:
                value:
                  url: http://example.com/my-iso.iso
        description: Include a JSON object in the request body with a content type of **application/json**.
      security:
      - API Key: []
    servers:
    - url: https://api.vultr.com/v2
  /iso/{iso-id}:
    parameters:
    - schema:
        type: string
      name: iso-id
      in: path
      required: true
      description: The [ISO id](#operation/list-isos).
    get:
      summary: Get ISO
      tags:
      - iso
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/iso/{iso-id}\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  iso:
                    $ref: '#/components/schemas/iso'
              examples:
                response:
                  value:
                    iso:
                      id: cb676a46-66fd-4dfb-b839-443f2e6c0b60
                      date_created: '2020-10-10T01:56:20+00:00'
                      filename: my-iso.iso
                      size: 120586240
                      md5sum: 77ba289bdc966ec996278a5a740d96d8
                      sha512sum: 2b31b6fcab34d6ea9a6b293601c39b90cb044e5679fcc5
                      status: complete
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: iso-get
      description: Get information for an ISO.
      security:
      - API Key: []
    delete:
      summary: Delete ISO
      tags:
      - iso
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/iso/{iso-id}\" \\\n  -X DELETE \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: delete-iso
      description: Delete an ISO.
      security:
      - API Key: []
    servers:
    - url: https://api.vultr.com/v2
  /iso-public:
    get:
      summary: List Public ISOs
      tags:
      - iso
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/iso-public\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_isos:
                    type: array
                    items:
                      $ref: '#/components/schemas/iso-public'
                  meta:
                    $ref: '#/components/schemas/meta'
              examples:
                response:
                  value:
                    public_isos:
                    - id: cb676a46-66fd-4dfb-b839-443f2e6c0b604
                      name: CentOS 7
                      description: 7 x86_64 Minimal
                      md5sum: 7f4df50f42ee1b52b193e79855a3aa19
                    meta:
                      total: 1
                      links:
                        next: ''
                        prev: ''
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      operationId: list-public-isos
      description: List all Vultr Public ISOs.
      security: []
    servers:
    - url: https://api.vultr.com/v2
