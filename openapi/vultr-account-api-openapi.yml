openapi: 3.2.0
info:
  title: Vultr Account API
  version: '2.0'
  description: 'Operations tagged account across 3 of this provider''s published API definitions: vultr-schema-openapi.json, vultr-v2-openapi.yaml, vultr-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.vultr.com/v2
security:
- API Key: []
tags:
- name: Account
  x-displayName: Account
  description: Read-only information about your user account and billing information.
paths:
  /account:
    get:
      summary: Get Account Info
      tags:
      - Account
      x-codeSamples:
      - lang: Curl
        source: "curl \"https://api.vultr.com/v2/account\" \\\n  -X GET \\\n  -H \"Authorization: Bearer ${VULTR_API_KEY}\""
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/account'
              examples:
                response:
                  value:
                    account:
                      name: Example Account
                      email: admin@example.com
                      acls:
                      - manage_users
                      - subscriptions_view
                      - subscriptions
                      - billing
                      - support
                      - provisioning
                      - dns
                      - abuse
                      - upgrade
                      - firewall
                      - alerts
                      - objstore
                      - loadbalancer
                      balance: -100.55
                      pending_charges: 60.25
                      last_payment_date: '2020-10-10T01:56:20+00:00'
                      last_payment_amount: -1.25
      operationId: get-account
      security:
      - API Key: []
      description: Get your Vultr account, permission, and billing information.
    servers:
    - url: https://api.vultr.com/v2
