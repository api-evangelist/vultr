  description: >-
    [One-Click](https://www.vultr.com/features/one-click-apps/) and [Marketplace](https://www.vultr.com/marketplace/)
    Applications are ready-to-run with minimal configuration. We have an extensive [documentation library](https://www.vultr.com/docs/category/apps)
    for our Applications.

    <br><br>There are two types of Applications: `marketplace` and `one-click`. This is denoted by the
    `type` field in the Application object. Applications with `type` of `marketplace` can be deployed
    by using the `image_id` while Applications with `type` of `one-click` should use the `id`.
