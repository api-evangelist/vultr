- aid: vultr:vultr-backup-api
  name: Vultr Backup API
  description: >-
    A backup is a scheduled, automatic, point-in-time image of an instance. We do not stop the instance
    when taking a backup. Booting from a backup is similar to rebooting after a non-graceful restart.
    [Snapshots](#tag/snapshot) are physically the same as backups, but snapshots are manual while backups
    run automatically on a schedule. Backups can be converted into snapshots. See our [Automatic Backup
    FAQ](https://www.vultr.com/docs/vps-automatic-backups) for more information.
  humanURL: https://docs.vultr.com
  baseURL: https://api.vultr.com/v2
